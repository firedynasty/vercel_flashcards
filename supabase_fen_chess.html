<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEN Puzzle Order</title>
<style>
:root { --bg: #16213e; --surface: #1a1a2e; --row: #0f3460; --text: #eee; --muted: #9aa5c4; --accent: #e94560; --ok: #4ade80; --err: #f87171; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
main { max-width: 820px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 4px 0 14px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
select, button { font: inherit; font-size: 14px; color: var(--text); background: var(--row); border: 1px solid var(--surface); border-radius: 6px; padding: 8px 10px; }
select { min-width: 220px; flex: 1; }
button { cursor: pointer; font-weight: 600; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .3; cursor: default; }
#status { font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
#status.ok { color: var(--ok); } #status.err { color: var(--err); }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
li { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 8px; padding: 8px 10px; }
li.moved { outline: 2px solid var(--accent); }
.pos { width: 28px; text-align: right; font-weight: 700; color: var(--muted); font-family: monospace; }
.kind { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(233, 69, 96, .3); }
.kind.fen { background: rgba(74, 222, 128, .2); }
.body { flex: 1; min-width: 0; }
.fen { font-family: monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.id { font-size: 11px; color: var(--muted); font-family: monospace; }
.arrows { display: flex; gap: 4px; }
.arrows button { padding: 4px 10px; }
.trash { padding: 4px 10px; }
.trash.armed { background: var(--err); border-color: var(--err); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>♟ FEN puzzle order</h1>
  <div class="bar">
    <select id="category" onchange="loadList()"><option>Loading categories…</option></select>
    <button onclick="loadList()">↻ Refresh</button>
  </div>
  <div id="status"></div>
  <ol id="list"></ol>
</main>

<script>
// Reorders fen-saver's puzzles by their `position` column (see api/puzzles-order.js).
// ▲ / ▼ swaps a puzzle with its neighbour; fen-saver's dropdown shows the same order.
var API = '/api/puzzles-order';
var rows = [];
var busy = false;
var armedId = null;   // puzzle whose trash button was clicked once

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function status(msg, type) { $('status').textContent = msg; $('status').className = type || ''; }

function api(query, body) {
  return fetch(API + (query || ''), body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
    .then(function(r) { return r.json().then(function(d) { if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status)); return d; }); });
}

// Same test as fen-saver's sbIsPgn: a saved PGN carries a [FEN "..."] header.
function isPgn(s) { return /\[FEN\s+"/.test(s || ''); }

function loadCategories() {
  api('?action=categories').then(function(cats) {
    var saved = null;
    try { saved = localStorage.getItem('fenOrderCategory'); } catch (e) {}
    $('category').innerHTML = cats.map(function(c) { return '<option>' + esc(c) + '</option>'; }).join('');
    if (saved && cats.indexOf(saved) >= 0) $('category').value = saved;
    if (cats.length) loadList(); else status('No puzzles in Supabase yet.');
  }).catch(function(e) { status('Could not load categories: ' + e.message, 'err'); });
}

function loadList() {
  var cat = $('category').value;
  try { localStorage.setItem('fenOrderCategory', cat); } catch (e) {}
  status('Loading…');
  api('?action=list&category=' + encodeURIComponent(cat)).then(function(r) {
    rows = r;
    render();
    status(rows.length + ' puzzle' + (rows.length !== 1 ? 's' : '') + ' in "' + cat + '". Use ▲ ▼ to reorder.');
  }).catch(function(e) { status('Could not load puzzles: ' + e.message, 'err'); });
}

function render(movedId) {
  $('list').innerHTML = rows.map(function(r, i) {
    var pgn = isPgn(r.fen);
    return '<li' + (r.id === movedId ? ' class="moved"' : '') + '>' +
      '<span class="pos">' + (i + 1) + '</span>' +
      '<span class="kind' + (pgn ? '' : ' fen') + '">' + (pgn ? 'PGN' : 'FEN') + '</span>' +
      '<div class="body"><div class="fen" title="' + esc(r.fen) + '">' + esc(r.fen) + '</div>' +
      (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '') + '</div>' +
      '<span class="id">id ' + r.id + '</span>' +
      '<span class="arrows">' +
        '<button title="Move up" ' + (i === 0 ? 'disabled ' : '') + 'onclick="move(' + r.id + ',\'up\')">▲</button>' +
        '<button title="Move down" ' + (i === rows.length - 1 ? 'disabled ' : '') + 'onclick="move(' + r.id + ',\'down\')">▼</button>' +
      '</span>' +
      '<button class="trash' + (r.id === armedId ? ' armed' : '') + '" title="Delete (click twice)" onclick="trash(' + r.id + ')">' +
        (r.id === armedId ? 'Delete?' : '🗑') + '</button></li>';
  }).join('');
}

function move(id, direction) {
  if (busy) return;
  armedId = null;
  busy = true;
  status('Saving…');
  api('', { action: 'move', id: id, direction: direction }).then(function(r) {
    rows = r;
    render(id);
    status('Moved id ' + id + ' ' + direction + '. Saved to Supabase.', 'ok');
  }).catch(function(e) { status('Move failed: ' + e.message, 'err'); })
    .finally(function() { busy = false; });
}

// First click arms the button ("Delete?"), second click on the same puzzle deletes it.
function trash(id) {
  if (busy) return;
  if (armedId !== id) { armedId = id; render(); return; }
  armedId = null;
  busy = true;
  status('Deleting id ' + id + '…');
  api('', { action: 'delete', id: id }).then(function(r) {
    rows = r;
    render();
    status('Deleted id ' + id + '. ' + rows.length + ' puzzle' + (rows.length !== 1 ? 's' : '') + ' left in "' + $('category').value + '".', 'ok');
    if (!rows.length) loadCategories();
  }).catch(function(e) { status('Delete failed: ' + e.message, 'err'); render(); })
    .finally(function() { busy = false; });
}

// Clicking anywhere else disarms a pending delete.
document.addEventListener('click', function(e) {
  if (armedId !== null && !e.target.closest('.trash')) { armedId = null; render(); }
});

loadCategories();
</script>
</body>
</html>
