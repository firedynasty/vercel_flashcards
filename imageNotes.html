<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            overscroll-behavior: none;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            touch-action: manipulation;
        }

        /* Toolbar - pinned to top while scrolling */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: nowrap;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(8px);
            padding: 5px 8px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .toolbar .title {
            font-size: 0.85rem;
            color: #a8d8ea;
            font-weight: 600;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .tool-btn {
            min-height: 32px;
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tool-btn.active {
            background: #3B82F6;
            border-color: #3B82F6;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #loadImgBtn {
            border-color: #f97316;
            color: #f97316;
        }

        #loadImgBtn:hover {
            background: rgba(249, 115, 22, 0.15);
        }

        .stroke-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a8d8ea;
            font-size: 0.9rem;
            min-height: 40px;
        }

        input[type="range"] {
            width: 90px;
            height: 24px;
        }

        /* Reference image area */
        .image-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        #imgPlaceholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            padding: 6px 12px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        #refImg {
            max-width: 100%;
            max-height: 35vh;
            border-radius: 10px;
            object-fit: contain;
            cursor: pointer;
            transition: max-height 0.25s ease;
        }

        #refImg.expanded {
            max-height: 75vh;
        }

        .img-caption {
            font-size: 0.75rem;
            color: #a8d8ea;
            margin-top: 4px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Canvas area: tall so you can scroll down and keep writing.
           svh keeps the height stable when the mobile URL bar hides/shows.
           Side margins leave a touch strip for scrolling while in Draw mode. */
        .canvas-wrapper {
            height: 150vh;
            height: 150svh;
            margin: 0 30px;
            flex-shrink: 0;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            background: #fff;
            touch-action: none;
        }

        #gridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0.35;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="tool-btn" id="loadImgBtn">Img</button>
        <button class="tool-btn" id="clearBtn">Clear</button>
        <button class="tool-btn" id="darkBtn">Dark</button>
        <button class="tool-btn" id="gridBtn">Grid</button>
        <button class="tool-btn" id="undoBtn" title="Undo last stroke (Ctrl+Z)" disabled>Undo</button>
        <button class="tool-btn" id="scrollUpBtn" title="Scroll up">↑</button>
        <button class="tool-btn" id="scrollDownBtn" title="Scroll down">↓</button>
        <input type="range" id="strokeSize" min="2" max="20" value="2" style="width:75px; height:24px;">
        <button class="ml-2 px-2 py-0.5 rounded focus:outline-none text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600" id="notesBtn" title="Open notes (synced to Dropbox)">Notes</button>
        <button class="ml-2 px-2 py-0.5 rounded focus:outline-none text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700" id="ocrBtn" title="Extract text (English)">OCR</button>
        <button class="ml-2 px-2 py-0.5 rounded focus:outline-none text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700" id="ocrChinBtn" title="Extract text (Chinese)">中文</button>
    </div>

    <!-- OCR result overlay -->
    <div id="ocrOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:300; align-items:center; justify-content:center; padding:20px;">
      <div style="background:#1e293b; border-radius:16px; width:100%; max-width:480px; padding:20px; display:flex; flex-direction:column; gap:14px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="color:#a8d8ea; font-weight:700; font-size:1rem;">OCR Result</span>
          <button id="ocrCloseBtn" style="background:none; border:none; color:#94a3b8; font-size:1.25rem; cursor:pointer; padding:4px 8px; border-radius:6px;" title="Close">✕</button>
        </div>
        <div id="ocrStatus" style="font-size:12px; color:#94a3b8; min-height:16px;"></div>
        <textarea id="ocrResult" style="background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:12px; font-size:14px; line-height:1.6; resize:vertical; font-family:inherit; outline:none; min-height:120px;"></textarea>
        <button id="ocrCopyBtn" style="padding:10px 0; font-size:14px; border:none; border-radius:8px; background:#2563eb; color:white; cursor:pointer; font-weight:600;">Copy to clipboard</button>
      </div>
    </div>

    <div class="image-area" id="imageArea">
        <div id="imgPlaceholder">Load a reference image (e.g. a YouTube screenshot)</div>
        <img id="refImg" style="display:none" alt="Reference image">
        <div class="img-caption" id="imgCaption"></div>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="drawCanvas"></canvas>
        <canvas id="gridCanvas"></canvas>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <!-- Notes / Dropbox sync modal -->
    <div id="notesModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:200; align-items:center; justify-content:center; padding:20px;">
      <div style="background:#1e293b; border-radius:16px; width:100%; max-width:480px; padding:20px; display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="color:#a8d8ea; font-weight:700; font-size:1rem;">Drawing — Dropbox sync</span>
          <button id="notesCloseBtn" style="background:none; border:none; color:#94a3b8; font-size:1.25rem; cursor:pointer; padding:4px 8px; border-radius:6px;" title="Close">✕</button>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button id="notesDbxAuthBtn" style="font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid #ccc; background:#f5f5f3; color:#555; cursor:pointer; font-family:inherit; font-weight:600; white-space:nowrap;">Dropbox</button>
          <button id="notesLoadBtn" style="flex:1 1 0; padding:10px 0; font-size:15px; border:1px solid #ccc; border-radius:8px; background:#f5f5f5; color:#333; cursor:pointer; font-weight:600;">&#8595; Load</button>
          <button id="notesSaveBtn" style="flex:2 1 0; padding:10px 0; font-size:15px; border:none; border-radius:8px; background:rgb(217,119,6); color:white; cursor:pointer; font-weight:600;">&#8593; Save to Dropbox</button>
        </div>
        <div id="notesStatus" style="font-size:12px; color:#94a3b8; min-height:16px;"></div>
      </div>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const gridCanvas = document.getElementById('gridCanvas');
        const gridCtx = gridCanvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        const refImg = document.getElementById('refImg');
        const imgCaption = document.getElementById('imgCaption');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const fileInput = document.getElementById('fileInput');
        const gridBtn = document.getElementById('gridBtn');
        const darkBtn = document.getElementById('darkBtn');
        const undoBtn = document.getElementById('undoBtn');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let strokeSizeValue = 2;
        let showGrid = false;
        let isDark = false;
        let imgURL = null;
        let strokes = [];        // completed strokes, for undo
        let currentStroke = null;
        const MAX_HISTORY = 100;
        let cssW = 0;
        let cssH = 0;
        const GRID_STEP = 25;

        // Size both canvases to fill the wrapper, preserving existing drawing.
        // Canvas backing store is scaled by devicePixelRatio (capped at 2 to
        // bound memory on high-DPI phones) for crisp lines on mobile.
        function resizeCanvas() {
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            if (w === 0 || h === 0) return;
            // Nothing to do if size is unchanged (setting canvas width clears it)
            if (canvas.style.width === w + 'px' && canvas.style.height === h + 'px') return;

            const temp = document.createElement('canvas');
            temp.width = canvas.width;
            temp.height = canvas.height;
            temp.getContext('2d').drawImage(canvas, 0, 0);

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            cssW = w;
            cssH = h;
            [canvas, gridCanvas].forEach(c => {
                c.width = Math.round(w * dpr);
                c.height = Math.round(h * dpr);
                c.style.width = w + 'px';
                c.style.height = h + 'px';
            });

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = isDark ? '#fff' : '#000';
            ctx.lineWidth = strokeSizeValue;
            gridCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (temp.width > 0 && temp.height > 0) {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.drawImage(temp, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            drawGrid();
        }

        // Graph-paper grid (coords are in CSS px thanks to the dpr transform)
        function drawGrid() {
            gridCtx.clearRect(0, 0, cssW, cssH);
            if (!showGrid) return;

            gridCtx.strokeStyle = isDark ? '#6b7280' : '#bbb';
            gridCtx.lineWidth = 1;
            gridCtx.beginPath();
            for (let x = GRID_STEP + 0.5; x < cssW; x += GRID_STEP) {
                gridCtx.moveTo(x, 0);
                gridCtx.lineTo(x, cssH);
            }
            for (let y = GRID_STEP + 0.5; y < cssH; y += GRID_STEP) {
                gridCtx.moveTo(0, y);
                gridCtx.lineTo(cssW, y);
            }
            gridCtx.stroke();
            gridCtx.strokeRect(0.5, 0.5, cssW - 1, cssH - 1);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            currentStroke = { color: ctx.strokeStyle, width: ctx.lineWidth, points: [{ x: pos.x, y: pos.y }] };
            // Draw a dot immediately so single taps are visible
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
            if (currentStroke) currentStroke.points.push({ x: pos.x, y: pos.y });
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentStroke) {
                strokes.push(currentStroke);
                if (strokes.length > MAX_HISTORY) strokes.shift();
                currentStroke = null;
                updateUndoBtn();
            }
        }

        // Undo: replay all remaining strokes from scratch
        function replayStroke(s) {
            ctx.strokeStyle = s.color;
            ctx.fillStyle = s.color;
            ctx.lineWidth = s.width;
            if (s.points.length === 1) {
                ctx.beginPath();
                ctx.arc(s.points[0].x, s.points[0].y, s.width / 2, 0, Math.PI * 2);
                ctx.fill();
                return;
            }
            ctx.beginPath();
            ctx.moveTo(s.points[0].x, s.points[0].y);
            for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
            ctx.stroke();
        }

        function redrawAll() {
            ctx.clearRect(0, 0, cssW, cssH);
            strokes.forEach(replayStroke);
            // Restore current pen settings for the next stroke
            ctx.strokeStyle = isDark ? '#fff' : '#000';
            ctx.lineWidth = strokeSizeValue;
        }

        function undo() {
            if (!strokes.length) return;
            strokes.pop();
            redrawAll();
            updateUndoBtn();
        }

        function updateUndoBtn() {
            undoBtn.disabled = strokes.length === 0;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        // Toolbar

        const SCROLL_AMOUNT = 600;
        document.getElementById('scrollUpBtn').addEventListener('click', () => window.scrollBy({ top: -SCROLL_AMOUNT, behavior: 'smooth' }));
        document.getElementById('scrollDownBtn').addEventListener('click', () => window.scrollBy({ top: SCROLL_AMOUNT, behavior: 'smooth' }));

        document.getElementById('clearBtn').addEventListener('click', () => {
            strokes = [];
            ctx.clearRect(0, 0, cssW, cssH);
            updateUndoBtn();
        });

        undoBtn.addEventListener('click', undo);

        // Ctrl+Z / Cmd+Z for undo on desktop keyboards
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
            }
        });

        darkBtn.addEventListener('click', () => {
            isDark = !isDark;
            canvas.style.background = isDark ? '#374151' : '#fff';
            ctx.strokeStyle = isDark ? '#ffffff' : '#000000';
            darkBtn.textContent = isDark ? 'Light' : 'Dark';
            darkBtn.classList.toggle('active', isDark);
            drawGrid();
        });

        gridBtn.addEventListener('click', () => {
            showGrid = !showGrid;
            gridBtn.classList.toggle('active', showGrid);
            drawGrid();
        });

        document.getElementById('strokeSize').addEventListener('input', (e) => {
            strokeSizeValue = e.target.value;
            ctx.lineWidth = strokeSizeValue;
        });

        // Image loading
        document.getElementById('loadImgBtn').addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (imgURL) URL.revokeObjectURL(imgURL);
            imgURL = URL.createObjectURL(file);
            refImg.src = imgURL;
            imgCaption.textContent = file.name;
            e.target.value = '';
        });

        refImg.addEventListener('load', () => {
            imgPlaceholder.style.display = 'none';
            refImg.style.display = '';
            resizeCanvas();
        });

        // Tap image to expand/shrink
        refImg.addEventListener('click', () => {
            refImg.classList.toggle('expanded');
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

        resizeCanvas();

        // ── DROPBOX DRAWING SYNC ──
        const DRAWING_DBX_PATH = '/flashcards/vercel/imagenotes.json';
        var DBX_TOKEN = null;

        function notesDbxSetAuthBtn() {
            var btn = document.getElementById('notesDbxAuthBtn');
            if (!btn) return;
            if (DBX_TOKEN) {
                btn.textContent = '● Dropbox'; btn.style.color = '#0061fe'; btn.style.borderColor = '#0061fe'; btn.title = 'Connected — click to sign out';
            } else {
                btn.textContent = 'Dropbox'; btn.style.color = '#555'; btn.style.borderColor = '#ccc'; btn.title = 'Sign in to Dropbox';
            }
        }

        async function dbxGetAppKey() {
            if (['localhost', '127.0.0.1'].includes(window.location.hostname)) {
                var k = localStorage.getItem('dropbox-app-key') || '';
                if (!k) { k = prompt('Dropbox App Key:') || ''; if (k) localStorage.setItem('dropbox-app-key', k); }
                return k;
            }
            try { var r = await fetch('/api/dropbox-key'); return (await r.json()).key || ''; } catch(e) { return ''; }
        }

        function dbxMakeVerifier() {
            var a = new Uint8Array(64); crypto.getRandomValues(a);
            return btoa(String.fromCharCode.apply(null, a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        }

        async function dbxMakeChallenge(v) {
            var d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
            return btoa(String.fromCharCode.apply(null, new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        }

        async function dbxSignIn(pendingAction) {
            var key = await dbxGetAppKey();
            if (!key) { alert('Dropbox App Key not configured'); return; }
            if (pendingAction) sessionStorage.setItem('dbx_pending', pendingAction);
            var v = dbxMakeVerifier();
            var c = await dbxMakeChallenge(v);
            var uri = window.location.origin + window.location.pathname;
            var authUrl = 'https://www.dropbox.com/oauth2/authorize?client_id=' + key +
                '&response_type=code&code_challenge=' + c + '&code_challenge_method=S256&redirect_uri=' + encodeURIComponent(uri) + '&token_access_type=online';
            localStorage.setItem('dbx_verifier', v);
            var popup = window.open(authUrl, 'dropbox_auth', 'width=520,height=680,scrollbars=yes,resizable=yes');
            if (!popup) {
                localStorage.removeItem('dbx_verifier'); sessionStorage.setItem('dbx_verifier', v);
                window.location.href = authUrl;
            }
        }

        async function dbxHandleRedirect() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            if (!code) return;
            var v = localStorage.getItem('dbx_verifier') || sessionStorage.getItem('dbx_verifier');
            var key = await dbxGetAppKey();
            if (!v || !key) return;
            var uri = window.location.origin + window.location.pathname;
            try {
                var r = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ code: code, grant_type: 'authorization_code', client_id: key, redirect_uri: uri, code_verifier: v }).toString()
                });
                var d = await r.json();
                localStorage.removeItem('dbx_verifier'); sessionStorage.removeItem('dbx_verifier');
                if (d.access_token) {
                    if (window.opener && !window.opener.closed) { window.opener.postMessage({ dropboxToken: d.access_token }, window.location.origin); window.close(); return; }
                    DBX_TOKEN = d.access_token; window.history.replaceState({}, document.title, window.location.pathname);
                } else { if (window.opener && !window.opener.closed) window.close(); }
            } catch(e) { console.error('Dropbox auth:', e); if (window.opener && !window.opener.closed) window.close(); }
        }

        async function dbxDownload(path) {
            var r = await fetch('https://content.dropboxapi.com/2/files/download', {
                method: 'POST', headers: { Authorization: 'Bearer ' + DBX_TOKEN, 'Dropbox-API-Arg': JSON.stringify({ path: path }) }
            });
            if (r.status === 401) { DBX_TOKEN = null; notesDbxSetAuthBtn(); throw new Error('Session expired — sign in again'); }
            if (r.status === 409) throw new Error('File not found in Dropbox');
            if (!r.ok) throw new Error('Download failed (' + r.status + ')');
            return await r.text();
        }

        async function dbxUpload(path, content) {
            var r = await fetch('https://content.dropboxapi.com/2/files/upload', {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + DBX_TOKEN, 'Dropbox-API-Arg': JSON.stringify({ path: path, mode: { '.tag': 'overwrite' }, mute: true }), 'Content-Type': 'application/octet-stream' },
                body: content
            });
            if (r.status === 401) { DBX_TOKEN = null; notesDbxSetAuthBtn(); throw new Error('Session expired — sign in again'); }
            if (!r.ok) throw new Error('Upload failed (' + r.status + ')');
        }

        // Notes modal open/close
        const notesModal = document.getElementById('notesModal');
        document.getElementById('notesBtn').addEventListener('click', () => {
            notesModal.style.display = 'flex';
        });
        document.getElementById('notesCloseBtn').addEventListener('click', () => {
            notesModal.style.display = 'none';
        });
        notesModal.addEventListener('click', (e) => {
            if (e.target === notesModal) notesModal.style.display = 'none';
        });

        // Dropbox auth button
        document.getElementById('notesDbxAuthBtn').addEventListener('click', function() {
            if (DBX_TOKEN) {
                try { fetch('https://api.dropboxapi.com/2/auth/token/revoke', { method: 'POST', headers: { Authorization: 'Bearer ' + DBX_TOKEN } }); } catch(e) {}
                DBX_TOKEN = null; notesDbxSetAuthBtn();
            } else { dbxSignIn('notes-load'); }
        });

        // Load drawing from Dropbox
        document.getElementById('notesLoadBtn').addEventListener('click', async function() {
            var statusEl = document.getElementById('notesStatus');
            if (!DBX_TOKEN) { statusEl.textContent = 'Signing in…'; await dbxSignIn('notes-load'); return; }
            var btn = this; btn.disabled = true; btn.textContent = 'Loading…'; statusEl.textContent = '';
            try {
                var text = await dbxDownload(DRAWING_DBX_PATH);
                var data = JSON.parse(text);
                strokes = data.strokes || [];
                redrawAll();
                updateUndoBtn();
                statusEl.textContent = '✅ Loaded (' + strokes.length + ' strokes)';
                setTimeout(() => { notesModal.style.display = 'none'; statusEl.textContent = ''; }, 800);
            } catch(e) { statusEl.textContent = '❌ ' + e.message; }
            finally { btn.disabled = false; btn.textContent = '↓ Load'; }
        });

        // Save drawing to Dropbox
        document.getElementById('notesSaveBtn').addEventListener('click', async function() {
            var statusEl = document.getElementById('notesStatus');
            if (!DBX_TOKEN) { statusEl.textContent = 'Signing in…'; await dbxSignIn('notes-save'); return; }
            var btn = this; btn.disabled = true; btn.textContent = 'Saving…'; statusEl.textContent = '';
            try {
                var data = JSON.stringify({ width: cssW, height: cssH, strokes: strokes });
                await dbxUpload(DRAWING_DBX_PATH, data);
                statusEl.textContent = '✅ Saved (' + strokes.length + ' strokes)';
                setTimeout(() => { notesModal.style.display = 'none'; statusEl.textContent = ''; }, 800);
            } catch(e) { statusEl.textContent = '❌ ' + e.message; }
            finally { btn.disabled = false; btn.textContent = '↑ Save to Dropbox'; }
        });

        // Handle Dropbox popup postMessage
        window.addEventListener('message', function(event) {
            if (event.origin !== window.location.origin) return;
            if (event.data && event.data.dropboxToken) {
                DBX_TOKEN = event.data.dropboxToken; notesDbxSetAuthBtn();
                var pending = sessionStorage.getItem('dbx_pending');
                if (pending === 'notes-load') { sessionStorage.removeItem('dbx_pending'); document.getElementById('notesLoadBtn').click(); }
                else if (pending === 'notes-save') { sessionStorage.removeItem('dbx_pending'); document.getElementById('notesSaveBtn').click(); }
            }
        });

        (async function dbxBoot() {
            await dbxHandleRedirect();
            notesDbxSetAuthBtn();
        })();

        // ── OCR ──
        const ocrOverlay = document.getElementById('ocrOverlay');
        document.getElementById('ocrBtn').addEventListener('click', () => ocrRun(false));
        document.getElementById('ocrChinBtn').addEventListener('click', () => ocrRun(true));
        document.getElementById('ocrCloseBtn').addEventListener('click', () => { ocrOverlay.style.display = 'none'; });
        ocrOverlay.addEventListener('click', (e) => { if (e.target === ocrOverlay) ocrOverlay.style.display = 'none'; });
        document.getElementById('ocrCopyBtn').addEventListener('click', () => {
            const text = document.getElementById('ocrResult').value;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('ocrCopyBtn');
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy to clipboard'; }, 1800);
            });
        });

        async function ocrRun(chinese) {
            if (strokes.length === 0) { alert('Nothing drawn yet.'); return; }

            // Compute bounding box of all stroke points
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            strokes.forEach(s => s.points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            }));
            const PAD = 12;
            minX = Math.max(0, minX - PAD);
            minY = Math.max(0, minY - PAD);
            maxX = Math.min(cssW, maxX + PAD);
            maxY = Math.min(cssH, maxY + PAD);
            const cropW = maxX - minX;
            const cropH = maxY - minY;
            if (cropW < 2 || cropH < 2) { alert('Drawing area too small.'); return; }

            // Copy cropped region to a temp canvas (white bg) and export as base64
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const tmp = document.createElement('canvas');
            tmp.width = Math.round(cropW * dpr);
            tmp.height = Math.round(cropH * dpr);
            const tmpCtx = tmp.getContext('2d');
            tmpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            tmpCtx.fillStyle = isDark ? '#374151' : '#ffffff';
            tmpCtx.fillRect(0, 0, cropW, cropH);
            // Replay strokes offset by bounding box
            strokes.forEach(s => {
                if (s.points.length === 0) return;
                tmpCtx.strokeStyle = s.color;
                tmpCtx.fillStyle = s.color;
                tmpCtx.lineWidth = s.width;
                tmpCtx.lineCap = 'round';
                tmpCtx.lineJoin = 'round';
                if (s.points.length === 1) {
                    tmpCtx.beginPath();
                    tmpCtx.arc(s.points[0].x - minX, s.points[0].y - minY, s.width / 2, 0, Math.PI * 2);
                    tmpCtx.fill();
                    return;
                }
                tmpCtx.beginPath();
                tmpCtx.moveTo(s.points[0].x - minX, s.points[0].y - minY);
                for (let i = 1; i < s.points.length; i++) tmpCtx.lineTo(s.points[i].x - minX, s.points[i].y - minY);
                tmpCtx.stroke();
            });

            const dataUrl = tmp.toDataURL('image/png');
            const base64 = dataUrl.split(',')[1];

            // Get / prompt for access code
            var accessCode = localStorage.getItem('ocr-access-code') || '';
            if (!accessCode) {
                accessCode = prompt('Enter access code:') || '';
                if (!accessCode) return;
                localStorage.setItem('ocr-access-code', accessCode);
            }

            // Show overlay and call /api/ocr
            ocrOverlay.style.display = 'flex';
            const statusEl = document.getElementById('ocrStatus');
            const resultEl = document.getElementById('ocrResult');
            statusEl.textContent = 'Extracting text…';
            resultEl.value = '';

            try {
                const resp = await fetch('/api/ocr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode, imageBase64: base64, chinese }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    if (resp.status === 401) {
                        localStorage.removeItem('ocr-access-code');
                        statusEl.textContent = '❌ Invalid access code — cleared, try again.';
                    } else {
                        statusEl.textContent = '❌ ' + (data.error || 'Request failed');
                    }
                    return;
                }
                statusEl.textContent = '';
                resultEl.value = data.text || '(no text found)';
            } catch (e) {
                statusEl.textContent = '❌ ' + e.message;
            }
        }
    </script>
</body>
</html>
