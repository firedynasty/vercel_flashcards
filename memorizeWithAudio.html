<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorize With Audio</title>
  <style>
    html, body {
      background: #111;
      color: #ccc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #3ea6ff;
      font-size: 1.5rem;
      margin: 0 0 24px;
      font-weight: 600;
    }

    .audio-section {
      max-width: 620px;
      margin: 0 auto;
    }

    /* ── Local audio drop zone ── */
    #localAudioZone {
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #1a1a1a;
      border: 2px dashed #444;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .2s;
    }
    #localAudioZone:hover { border-color: #3ea6ff; }
    #localAudioLabel { color: #888; font-size: 13px; flex: 1; }
    #localAudioPlayer { flex: 2; min-width: 0; height: 36px; display: none; }

    .dbx-btn-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .dbx-btn {
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 18px;
      cursor: pointer;
    }
    .dbx-btn:hover { opacity: .85; }

    /* ── Text display ── */
    #textDisplay {
      display: none;
      max-width: 620px;
      margin: 0 auto;
    }
    #textDisplay h2 {
      font-size: 13px;
      color: #888;
      margin: 0 0 6px;
      font-weight: 400;
    }
    #textContent {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #ccc;
      font-size: 14px;
      padding: 12px;
      resize: vertical;
      min-height: 200px;
      box-sizing: border-box;
      font-family: inherit;
      line-height: 1.6;
    }

    /* ── Dropbox Song Browser Modal ── */
    #dbxSongOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    #dbxSongOverlay.open { display: flex; }
    #dbxSongModal {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      width: 92%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,.7);
    }
    #dbxSongModal .dsm-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
      gap: 10px;
    }
    #dbxSongModal .dsm-header h3 { margin: 0; font-size: 15px; color: #fff; flex: 1; }
    #dbxSongModal .dsm-close {
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    #dbxSongModal .dsm-close:hover { color: #fff; }
    #dbxSongModal .dsm-search-row { display: flex; gap: 8px; padding: 12px 16px 8px; }
    #dbxSongPathInput {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
    }
    #dbxSongPathInput:focus { border-color: #0061ff; }
    #dbxSongBrowseBtn {
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    #dbxSongBrowseBtn:disabled { opacity: .5; cursor: default; }
    #dbxSongStatus { padding: 0 16px 6px; font-size: 12px; color: #666; min-height: 18px; }
    #dbxSongBreadcrumb {
      padding: 0 16px 6px;
      font-size: 12px;
      color: #888;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-items: center;
    }
    .dsm-crumb {
      background: none;
      border: none;
      color: #3ea6ff;
      font-size: 12px;
      cursor: pointer;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .dsm-crumb:hover { background: #2a2a2a; }
    #dbxSongList { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
    .dsm-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      color: #ccc;
      transition: background .15s;
    }
    .dsm-item:hover { background: #2a2a2a; }
    .dsm-item.folder { color: #aaa; }
    .dsm-item.audio { color: #3ea6ff; }
    .dsm-item.text  { color: #ff9800; }
    .dsm-item .dsm-icon { font-size: 16px; flex-shrink: 0; }
    .dsm-item .dsm-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dsm-item .dsm-action {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      flex-shrink: 0;
    }
    .dsm-item.audio .dsm-action { background: #1565c0; color: #fff; }
    .dsm-item.text  .dsm-action { background: #e65100; color: #fff; }
    .dsm-signin-btn {
      display: block;
      margin: 20px auto;
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Memorize With Audio</h1>

  <div class="audio-section">
    <!-- Local audio drop zone -->
    <div id="localAudioZone"
         ondragover="event.preventDefault(); this.style.borderColor='#3ea6ff';"
         ondragleave="this.style.borderColor='#444';"
         ondrop="handleLocalAudioDrop(event);"
         onclick="document.getElementById('localAudioFileInput').click()">
      <span style="font-size:20px;">🎵</span>
      <span id="localAudioLabel">Drop or click to load an audio file</span>
      <audio id="localAudioPlayer" controls controlslist="nodownload"></audio>
      <input type="file" id="localAudioFileInput"
             accept=".mp3,.m4a,.wav,.ogg,.flac,.aac,.opus"
             style="display:none"
             onchange="loadLocalAudioFile(this.files); this.value='';">
    </div>

    <!-- Dropbox Songs button -->
    <div class="dbx-btn-row">
      <button class="dbx-btn" onclick="openDbxSongModal()">📂 Dropbox Songs</button>
    </div>
  </div>

  <!-- Text display (shown when a .txt file is loaded from Dropbox) -->
  <div id="textDisplay">
    <h2 id="textFileLabel"></h2>
    <textarea id="textContent" readonly></textarea>
  </div>

  <!-- Dropbox Song Browser Modal -->
  <div id="dbxSongOverlay" onclick="if(event.target===this) closeDbxSongModal()">
    <div id="dbxSongModal">
      <div class="dsm-header">
        <h3>📂 Dropbox Song Browser</h3>
        <button class="dsm-close" onclick="closeDbxSongModal()">&times;</button>
      </div>
      <div class="dsm-search-row">
        <input id="dbxSongPathInput" type="text" placeholder="/songs/" value="/songs/"
               onkeydown="if(event.key==='Enter') dbxSongBrowse(this.value.trim())">
        <button id="dbxSongBrowseBtn"
                onclick="dbxSongBrowse(document.getElementById('dbxSongPathInput').value.trim())">Browse</button>
      </div>
      <div id="dbxSongStatus"></div>
      <div id="dbxSongBreadcrumb"></div>
      <div id="dbxSongList"></div>
    </div>
  </div>

  <!-- Dropbox Auth -->
  <script>
  (function() {
    let dropboxAccessToken = null;
    let dropboxAppKey = '';

    const dbxIsLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);

    function generateCodeVerifier() {
      const array = new Uint8Array(64);
      crypto.getRandomValues(array);
      return btoa(String.fromCharCode(...array))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function generateCodeChallenge(verifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function fetchDropboxAppKey() {
      if (dbxIsLocalhost) return localStorage.getItem('dropbox-app-key') || '';
      try {
        const res = await fetch('/api/dropbox-key');
        const data = await res.json();
        return data.key || '';
      } catch { return ''; }
    }

    async function handleDropboxSignIn() {
      let appKey;
      if (dbxIsLocalhost) {
        appKey = prompt('Enter your Dropbox App Key:');
        if (!appKey) return;
        localStorage.setItem('dropbox-app-key', appKey);
      } else {
        appKey = await fetchDropboxAppKey();
        if (!appKey) { alert('Dropbox App Key not configured on server'); return; }
      }
      dropboxAppKey = appKey;

      const verifier = generateCodeVerifier();
      const challenge = await generateCodeChallenge(verifier);
      sessionStorage.setItem('dropbox_code_verifier', verifier);

      const redirectUri = window.location.origin + window.location.pathname;
      const authUrl = 'https://www.dropbox.com/oauth2/authorize?client_id=' + appKey
        + '&response_type=code&code_challenge=' + challenge
        + '&code_challenge_method=S256&redirect_uri=' + encodeURIComponent(redirectUri)
        + '&token_access_type=online';
      window.location.href = authUrl;
    }

    async function dropboxSignInPopup(onSuccess) {
      let appKey;
      if (dbxIsLocalhost) {
        appKey = prompt('Enter your Dropbox App Key:');
        if (!appKey) return;
        localStorage.setItem('dropbox-app-key', appKey);
      } else {
        appKey = await fetchDropboxAppKey();
        if (!appKey) { alert('Dropbox App Key not configured on server'); return; }
      }
      dropboxAppKey = appKey;

      const verifier = generateCodeVerifier();
      const challenge = await generateCodeChallenge(verifier);
      localStorage.setItem('dropbox_code_verifier', verifier);

      const redirectUri = window.location.origin + window.location.pathname;
      const authUrl = 'https://www.dropbox.com/oauth2/authorize?client_id=' + appKey
        + '&response_type=code&code_challenge=' + challenge
        + '&code_challenge_method=S256&redirect_uri=' + encodeURIComponent(redirectUri)
        + '&token_access_type=online';

      const w = 600, h = 700;
      const left = Math.round(window.screenX + (window.outerWidth - w) / 2);
      const top  = Math.round(window.screenY + (window.outerHeight - h) / 2);
      window.open(authUrl, 'dropbox-auth', `width=${w},height=${h},left=${left},top=${top}`);

      function handler(e) {
        if (e.origin !== window.location.origin) return;
        if (!e.data || e.data.type !== 'dropbox-token') return;
        dropboxAccessToken = e.data.token;
        window.removeEventListener('message', handler);
        if (onSuccess) onSuccess();
      }
      window.addEventListener('message', handler);
    }

    async function handleDropboxOAuthRedirect() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (!code) return;

      const verifier = sessionStorage.getItem('dropbox_code_verifier')
                    || localStorage.getItem('dropbox_code_verifier');
      const appKey = await fetchDropboxAppKey();
      if (!verifier || !appKey) return;
      dropboxAppKey = appKey;

      const redirectUri = window.location.origin + window.location.pathname;
      const body = new URLSearchParams({
        code,
        grant_type: 'authorization_code',
        client_id: appKey,
        redirect_uri: redirectUri,
        code_verifier: verifier,
      });

      try {
        const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString(),
        });
        const data = await res.json();
        if (data.access_token) {
          sessionStorage.removeItem('dropbox_code_verifier');
          localStorage.removeItem('dropbox_code_verifier');

          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(
              { type: 'dropbox-token', token: data.access_token },
              window.location.origin
            );
            window.close();
            return;
          }

          dropboxAccessToken = data.access_token;
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } catch (err) {
        console.error('Dropbox auth error:', err);
        if (window.opener && !window.opener.closed) window.close();
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      handleDropboxOAuthRedirect();

      window.getDropboxAccessToken = function() { return dropboxAccessToken; };
      window.handleDropboxSignIn = handleDropboxSignIn;
      window.dropboxSignInPopup = dropboxSignInPopup;

      window.dropboxDownloadFile = async function(path) {
        if (!dropboxAccessToken) return null;
        const res = await fetch('https://content.dropboxapi.com/2/files/download', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + dropboxAccessToken,
            'Dropbox-API-Arg': JSON.stringify({ path }),
          },
        });
        if (!res.ok) throw new Error('Download failed');
        return await res.text();
      };
    });
  })();
  </script>

  <!-- Local audio handlers -->
  <script>
  function handleLocalAudioDrop(e) {
    e.preventDefault();
    document.getElementById('localAudioZone').style.borderColor = '#444';
    loadLocalAudioFile(e.dataTransfer.files);
  }

  function loadLocalAudioFile(files) {
    if (!files || files.length === 0) return;
    const file = files[0];
    const url = URL.createObjectURL(file);
    const ap = document.getElementById('localAudioPlayer');
    ap.src = url;
    ap.style.display = 'block';
    ap.play();
    document.getElementById('localAudioLabel').textContent = file.name;
    document.getElementById('localAudioZone').style.borderColor = '#3ea6ff';
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Ignore when typing in an input/textarea
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    const ap = document.getElementById('localAudioPlayer');
    if (!ap || !ap.src) return;

    // ` — play/pause
    if (e.key === '`') {
      e.preventDefault();
      ap.paused ? ap.play() : ap.pause();
      return;
    }

    // 1-6 — seek 0:00–0:50
    const row0 = { '1': 0, '2': 10, '3': 20, '4': 30, '5': 40, '6': 50 };
    if (e.key in row0) { e.preventDefault(); ap.currentTime = row0[e.key]; return; }

    // w,e,r,t,y,u — seek 1:00–1:50
    const row1 = { w: 60, e: 70, r: 80, t: 90, y: 100, u: 110 };
    if (e.key in row1) { e.preventDefault(); ap.currentTime = row1[e.key]; return; }

    // s,d,f,g,h — seek 2:00–2:40
    const row2 = { s: 120, d: 130, f: 140, g: 150, h: 160 };
    if (e.key in row2) { e.preventDefault(); ap.currentTime = row2[e.key]; return; }

    // x,c,v,b,n,m — seek 3:00–3:50
    const row3 = { x: 180, c: 190, v: 200, b: 210, n: 220, m: 230 };
    if (e.key in row3) { e.preventDefault(); ap.currentTime = row3[e.key]; return; }
  });
  </script>

  <!-- Dropbox Song Browser -->
  <script>
  const DSM_AUDIO_EXT = new Set(['.mp3','.m4a','.wav','.ogg','.flac','.aac','.opus','.weba','.webm']);
  const DSM_TEXT_EXT  = new Set(['.txt','.md']);

  function openDbxSongModal() {
    const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
    document.getElementById('dbxSongOverlay').classList.add('open');
    if (!token) {
      document.getElementById('dbxSongList').innerHTML =
        '<button class="dsm-signin-btn" onclick="dbxSongSignIn()">Sign in with Dropbox</button>';
      document.getElementById('dbxSongStatus').textContent = 'Not signed in';
      return;
    }
    const path = document.getElementById('dbxSongPathInput').value.trim();
    if (path) dbxSongBrowse(path);
  }

  function closeDbxSongModal() {
    document.getElementById('dbxSongOverlay').classList.remove('open');
  }

  async function dbxSongSignIn() {
    closeDbxSongModal();
    if (window.handleDropboxSignIn) await window.handleDropboxSignIn();
  }

  async function dbxSongBrowse(path) {
    const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
    if (!token) { openDbxSongModal(); return; }

    const btn = document.getElementById('dbxSongBrowseBtn');
    btn.disabled = true;
    document.getElementById('dbxSongStatus').textContent = 'Loading…';
    document.getElementById('dbxSongList').innerHTML = '';

    const normPath = (path === '/' || path === '') ? '' : ('/' + path.replace(/^\/+|\/+$/g, ''));
    document.getElementById('dbxSongPathInput').value = normPath || '/';

    try {
      const res = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ path: normPath }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      const entries = (data.entries || [])
        .map(e => ({
          name: e.name,
          path: e.path_lower || e.path_display,
          isFolder: e['.tag'] === 'folder',
        }))
        .filter(e => {
          if (e.isFolder) return true;
          const ext = e.name.slice(e.name.lastIndexOf('.')).toLowerCase();
          return DSM_AUDIO_EXT.has(ext) || DSM_TEXT_EXT.has(ext);
        })
        .sort((a, b) => {
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
          return a.name.localeCompare(b.name, undefined, { numeric: true });
        });

      const fileCount = entries.filter(e => !e.isFolder).length;
      document.getElementById('dbxSongStatus').textContent =
        `${entries.filter(e => e.isFolder).length} folders · ${fileCount} files`;

      dbxSongRenderBreadcrumb(normPath);
      dbxSongRenderList(entries);
    } catch (err) {
      document.getElementById('dbxSongStatus').textContent = 'Error: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function dbxSongRenderBreadcrumb(path) {
    const el = document.getElementById('dbxSongBreadcrumb');
    if (!path) { el.innerHTML = ''; return; }
    const parts = path.replace(/^\//, '').split('/').filter(Boolean);
    let html = '<span style="color:#555;">▸</span> ';
    parts.forEach((part, i) => {
      const crumbPath = '/' + parts.slice(0, i + 1).join('/');
      if (i > 0) html += '<span style="color:#555;"> / </span>';
      html += `<button class="dsm-crumb" onclick="dbxSongBrowse('${crumbPath}')">${part}</button>`;
    });
    el.innerHTML = html;
  }

  function dbxSongRenderList(entries) {
    const list = document.getElementById('dbxSongList');
    if (entries.length === 0) {
      list.innerHTML = '<div style="color:#555;padding:20px;text-align:center;">No audio or text files found</div>';
      return;
    }
    list.innerHTML = entries.map(e => {
      if (e.isFolder) {
        return `<div class="dsm-item folder" onclick="dbxSongBrowse('${e.path}')">
          <span class="dsm-icon">📁</span>
          <span class="dsm-name">${e.name}</span>
        </div>`;
      }
      const ext = e.name.slice(e.name.lastIndexOf('.')).toLowerCase();
      const isAudio = DSM_AUDIO_EXT.has(ext);
      const cls   = isAudio ? 'audio' : 'text';
      const icon  = isAudio ? '🎵' : '📄';
      const label = isAudio ? 'Play' : 'Load';
      const fn    = isAudio
        ? `dbxSongPlayAudio('${e.path}','${e.name.replace(/'/g, "\\'")}')`
        : `dbxSongLoadText('${e.path}','${e.name.replace(/'/g, "\\'")}')`;
      return `<div class="dsm-item ${cls}">
        <span class="dsm-icon">${icon}</span>
        <span class="dsm-name">${e.name}</span>
        <button class="dsm-action" onclick="${fn}">${label}</button>
      </div>`;
    }).join('');
  }

  async function dbxSongPlayAudio(path, name) {
    const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
    if (!token) return;
    document.getElementById('dbxSongStatus').textContent = 'Fetching ' + name + '…';
    try {
      const res = await fetch('https://content.dropboxapi.com/2/files/download', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token,
          'Dropbox-API-Arg': JSON.stringify({ path }),
        },
      });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const ap   = document.getElementById('localAudioPlayer');
      ap.src = url;
      ap.style.display = 'block';
      ap.play();
      document.getElementById('localAudioLabel').textContent = name;
      document.getElementById('localAudioZone').style.borderColor = '#3ea6ff';
      document.getElementById('dbxSongStatus').textContent = '▶ ' + name;
      closeDbxSongModal();
    } catch (err) {
      document.getElementById('dbxSongStatus').textContent = 'Error: ' + err.message;
    }
  }

  async function dbxSongLoadText(path, name) {
    const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
    if (!token) return;
    document.getElementById('dbxSongStatus').textContent = 'Loading ' + name + '…';
    try {
      const res = await fetch('https://content.dropboxapi.com/2/files/download', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token,
          'Dropbox-API-Arg': JSON.stringify({ path }),
        },
      });
      if (!res.ok) throw new Error('Download failed');
      const text = await res.text();
      document.getElementById('textFileLabel').textContent = name;
      document.getElementById('textContent').value = text;
      document.getElementById('textDisplay').style.display = 'block';
      document.getElementById('dbxSongStatus').textContent = '✅ ' + name;
      closeDbxSongModal();
    } catch (err) {
      document.getElementById('dbxSongStatus').textContent = 'Error: ' + err.message;
    }
  }
  </script>

</body>
</html>
