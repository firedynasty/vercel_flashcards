<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn</title>
<script>
// One entry point for the two flashcard pages.
//   vocab → learn-google.html      (click = known, right-click = speak, Unknown CSV)
//   tts   → learn-chinese-tts.html (TTS reader, any language)
// ?mode=vocab|tts picks one; otherwise the last page you switched to with ⇄.
// Everything else in the query (?csv=…&name=…) is passed along.
(function() {
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode');
  if (mode !== 'vocab' && mode !== 'tts') {
    try { mode = localStorage.getItem('learnMode'); } catch (e) {}
  }
  if (mode === 'vocab' || mode === 'tts') {
    try { localStorage.setItem('learnMode', mode); } catch (e) {}
  } else {
    mode = 'vocab';
  }
  q.delete('mode');
  var rest = q.toString();
  location.replace((mode === 'tts' ? 'learn-chinese-tts.html' : 'learn-google.html') + (rest ? '?' + rest : '') + location.hash);
})();
</script>
</head>
<body></body>
</html>
