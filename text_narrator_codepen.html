<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Transcript Player</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0f0f;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Sticky navbar (header + player) ── */
.navbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

/* ── Header ── */
.header {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.header-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  flex: 1;
  min-width: 120px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-title small {
  color: #666;
  font-weight: 400;
  font-size: 12px;
  margin-left: 8px;
}
.btn {
  border: none;
  border-radius: 7px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-local { background: #2d2d2d; font-size: 13px; padding: 8px 14px; }

/* ── Audio player ── */
.player-section {
  background: #161616;
  border-top: 1px solid #222;
  padding: 12px 20px;
}
.player-label {
  font-size: 13px;
  color: #999;
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#audioEl {
  width: 100%;
  height: 36px;
  accent-color: #0061ff;
}

/* ── Transcript ── */
.transcript-section {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 40px;
  min-height: 0;
}
.transcript-empty {
  color: #444;
  font-size: 14px;
  text-align: center;
  margin-top: 80px;
  line-height: 1.8;
}

.seg {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.1s, border-color 0.1s;
}
.seg:hover { background: #1c1c1c; }
.seg.active {
  background: #0d1f0d;
  border-color: #1a3a1a;
}

.seg-ts {
  font-size: 11px;
  color: #888;
  min-width: 36px;
  padding-top: 3px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  transition: color 0.1s;
}
.seg.active .seg-ts { color: #4ecb71; }

.single-voice .seg-voice { display: none; }

.seg-voice {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  min-width: 64px;
  padding-top: 3px;
  flex-shrink: 0;
}
.seg-text {
  font-size: 14px;
  line-height: 1.6;
  flex: 1;
  color: #e0e0e0;
  transition: color 0.1s;
}
.seg.active .seg-text { color: #fff; }

.seg-ask {
  flex-shrink: 0;
  background: #252525;
  border: none;
  border-radius: 5px;
  color: #666;
  font-size: 11px;
  padding: 3px 9px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s, background 0.1s;
  align-self: flex-start;
  margin-top: 2px;
}
.seg:hover .seg-ask { opacity: 1; }
.seg-ask:hover { background: #333; color: #ccc; }

/* Voice colors — legacy role names */
.voice-narrator  { color: #777; }
.voice-student   { color: #4a9eff; }
.voice-teacher   { color: #4ecb71; }
.voice-scripture { color: #b89eff; }

/* Voice colors — Kokoro language prefixes */
.voice-lang-en { color: #a0a0a0; }
.voice-lang-zh { color: #f0a040; }
.voice-lang-fr { color: #b89eff; }
.voice-lang-es { color: #ff7070; }
.voice-lang-pt { color: #4ecb71; }
.voice-lang-ja { color: #ff9ec8; }
.voice-lang-ko { color: #40d0d0; }
.voice-lang-hi { color: #ffb347; }
.voice-lang-it { color: #90ee90; }

/* ── Light mode ── */
body.light {
  background: #f5f5f5;
  color: #1a1a1a;
}
body.light .navbar {
  background: #ffffff;
  border-bottom-color: #ddd;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
body.light .header-title { color: #111; }
body.light .header-title small { color: #888; }
body.light .btn-local { background: #e0e0e0; color: #222; }
body.light .btn-local:hover { background: #ccc; }
body.light .player-section { background: #f0f0f0; border-top-color: #ddd; }
body.light .player-label { color: #555; }
body.light .seg:hover { background: #e8e8e8; }
body.light .seg.active { background: #e6f4ea; border-color: #a8d5b5; }
body.light .seg-ts { color: #888; }
body.light .seg-text { color: #1a1a1a; }
body.light .seg.active .seg-text { color: #000; }
body.light .seg-ask { background: #e0e0e0; color: #666; }
body.light .seg-ask:hover { background: #ccc; color: #333; }
body.light .toast { background: #fff; border-color: #ccc; color: #333; }

/* ── Dark/Light toggle button ── */
.btn-theme {
  background: none;
  border: 1px solid #444;
  border-radius: 7px;
  color: #aaa;
  font-size: 16px;
  padding: 6px 10px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  line-height: 1;
}
.btn-theme:hover { border-color: #888; color: #fff; }
body.light .btn-theme { border-color: #bbb; color: #555; }
body.light .btn-theme:hover { border-color: #666; color: #111; }

/* ── Language picker ── */
.lang-picker-wrap { position: relative; }
.btn-lang {
  background: #2d2d2d;
  border: 1px solid #444;
  border-radius: 7px;
  color: #ddd;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.15s, background 0.15s;
}
.btn-lang:hover { background: #3a3a3a; border-color: #666; }
body.light .btn-lang { background: #e0e0e0; border-color: #bbb; color: #333; }
body.light .btn-lang:hover { background: #d0d0d0; }
.lang-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 60;
  min-width: 160px;
  overflow: hidden;
  padding: 4px 0;
}
.lang-dropdown.open { display: block; }
body.light .lang-dropdown { background: #fff; border-color: #ddd; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.lang-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  color: #ccc;
  transition: background 0.1s;
}
.lang-opt:hover { background: #2a2a2a; }
.lang-opt.selected { background: #1a2a1a; color: #4ecb71; }
body.light .lang-opt { color: #333; }
body.light .lang-opt:hover { background: #f0f0f0; }
body.light .lang-opt.selected { background: #e6f4ea; color: #16a34a; }
.lang-opt-flag { font-size: 16px; line-height: 1; }
.lang-opt-name { flex: 1; }
.lang-opt-code { font-size: 10px; color: #555; font-family: monospace; }
body.light .lang-opt-code { color: #999; }

/* ── Speak button (per segment) ── */
.seg-speak {
  flex-shrink: 0;
  background: #252525;
  border: none;
  border-radius: 5px;
  color: #666;
  font-size: 12px;
  padding: 3px 7px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s, background 0.1s, color 0.1s;
  align-self: flex-start;
  margin-top: 2px;
  line-height: 1.4;
}
.seg:hover .seg-speak { opacity: 1; }
.seg-speak:hover { background: #333; color: #ccc; }
.seg-speak.speaking { opacity: 1; color: #4ecb71; background: #1a2a1a; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #1e1e1e;
  border: 1px solid #3a3a3a;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  color: #ddd;
  z-index: 200;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- Sticky navbar: header + audio player -->
<div class="navbar">
  <div class="header">
    <div class="header-title">
      TTS Player
      <small id="fileLabel">— loading…</small>
    </div>
    <button class="btn btn-local" onclick="document.getElementById('localPicker').click()">📁 Local</button>
    <input type="file" id="localPicker" accept=".mp3,.m4a,.wav,.ogg,.json" multiple style="display:none" onchange="handleLocalFiles(this.files)">
    <button class="btn btn-local" onclick="changeFontSize(1)" title="Increase font size">A+</button>
    <button class="btn btn-local" onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
    <div class="lang-picker-wrap">
      <button class="btn-lang" id="langPickerBtn" onclick="toggleLangDropdown()" title="TTS language">🌐 <span id="langPickerLabel">EN</span></button>
      <div class="lang-dropdown" id="langDropdown"></div>
    </div>
    <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark/light mode">🌙</button>
  </div>
  <div class="player-section">
    <div class="player-label" id="playerLabel">Loading names.mp3…</div>
    <audio id="audioEl" controls></audio>
  </div>
</div>

<!-- Transcript -->
<div class="transcript-section" id="transcriptSection">
  <div class="transcript-empty" id="transcriptEmpty">
    Loading transcript…
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
// ── Asset URLs (CodePen) ──
const ASSET_MP3  = 'https://assets.codepen.io/1075762/names.mp3';
const ASSET_JSON = 'https://assets.codepen.io/1075762/names.json';

// ── Theme toggle ──
(function () {
  const saved = localStorage.getItem('tn_theme');
  if (saved === 'light') { document.body.classList.add('light'); document.getElementById('themeToggleBtn').textContent = '☀️'; }
})();
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('themeToggleBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('tn_theme', isLight ? 'light' : 'dark');
}

// ═══════════════════════════════════════════════════════════════════════
// LANGUAGE PICKER + WEB SPEECH TTS
// ═══════════════════════════════════════════════════════════════════════
const TTS_LANGUAGES = [
  { code: 'en-US', label: 'English',    flag: '🇺🇸', short: 'EN' },
  { code: 'zh-CN', label: 'Chinese',    flag: '🇨🇳', short: 'ZH' },
  { code: 'zh-HK', label: 'Cantonese', flag: '🇭🇰', short: 'HK' },
  { code: 'fr-FR', label: 'French',     flag: '🇫🇷', short: 'FR' },
  { code: 'es-ES', label: 'Spanish',    flag: '🇪🇸', short: 'ES' },
  { code: 'pt-PT', label: 'Portuguese', flag: '🇵🇹', short: 'PT' },
  { code: 'ja-JP', label: 'Japanese',   flag: '🇯🇵', short: 'JA' },
  { code: 'ko-KR', label: 'Korean',     flag: '🇰🇷', short: 'KO' },
  { code: 'hi-IN', label: 'Hindi',      flag: '🇮🇳', short: 'HI' },
  { code: 'it-IT', label: 'Italian',    flag: '🇮🇹', short: 'IT' },
];

let ttsLang = localStorage.getItem('tn_tts_lang') || 'en-US';
let speakingBtn = null;

(function initLangPicker() {
  const dropdown = document.getElementById('langDropdown');
  TTS_LANGUAGES.forEach(l => {
    const el = document.createElement('div');
    el.className = 'lang-opt' + (l.code === ttsLang ? ' selected' : '');
    el.dataset.code = l.code;
    el.innerHTML = `<span class="lang-opt-flag">${l.flag}</span><span class="lang-opt-name">${l.label}</span><span class="lang-opt-code">${l.code}</span>`;
    el.addEventListener('click', () => selectLang(l.code));
    dropdown.appendChild(el);
  });
  updateLangLabel();
})();

function updateLangLabel() {
  const lang = TTS_LANGUAGES.find(l => l.code === ttsLang) || TTS_LANGUAGES[0];
  document.getElementById('langPickerLabel').textContent = lang.short;
}

function selectLang(code) {
  ttsLang = code;
  localStorage.setItem('tn_tts_lang', code);
  document.querySelectorAll('.lang-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.code === code);
  });
  updateLangLabel();
  closeLangDropdown();
}

function toggleLangDropdown() {
  document.getElementById('langDropdown').classList.toggle('open');
}
function closeLangDropdown() {
  document.getElementById('langDropdown').classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.lang-picker-wrap')) closeLangDropdown();
});

function speakText(text, lang, btn) {
  if (!window.speechSynthesis) { showToast('Web Speech not supported'); return; }
  window.speechSynthesis.cancel();
  if (speakingBtn) { speakingBtn.classList.remove('speaking'); speakingBtn.textContent = '🔊'; }
  if (speakingBtn === btn) { speakingBtn = null; return; }

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang || ttsLang;

  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang === utt.lang && (v.localService || v.name.includes('Google')))
             || voices.find(v => v.lang.startsWith(utt.lang.split('-')[0]))
             || null;
  if (match) utt.voice = match;

  speakingBtn = btn;
  if (btn) { btn.classList.add('speaking'); btn.textContent = '⏹'; }
  utt.onend = utt.onerror = () => {
    if (btn) { btn.classList.remove('speaking'); btn.textContent = '🔊'; }
    if (speakingBtn === btn) speakingBtn = null;
  };
  window.speechSynthesis.speak(utt);
}

// ═══════════════════════════════════════════════════════════════════════
// VOICE / LANGUAGE INFO
// ═══════════════════════════════════════════════════════════════════════
const VOICE_INFO = {
  'am_michael': { label: 'Narrator',  colorClass: 'voice-narrator',  lang: 'en', tooltip: 'am_michael · English (American) male' },
  'am_adam':    { label: 'Adam',      colorClass: 'voice-student',   lang: 'en', tooltip: 'am_adam · English (American) male' },
  'af_bella':   { label: 'Bella',     colorClass: 'voice-teacher',   lang: 'en', tooltip: 'af_bella · English (American) female' },
  'bf_emma':    { label: 'Scripture', colorClass: 'voice-scripture', lang: 'en', tooltip: 'bf_emma · English (British) female' },
  'bm_george':  { label: 'George',    colorClass: 'voice-student',   lang: 'en', tooltip: 'bm_george · English (British) male' },
  'zf_xiaoxiao':{ label: '小小',      colorClass: 'voice-lang-zh',   lang: 'zh', tooltip: 'zf_xiaoxiao · Chinese female' },
  'ff_siwis':   { label: 'Siwis',     colorClass: 'voice-lang-fr',   lang: 'fr', tooltip: 'ff_siwis · French female' },
  'ef_dora':    { label: 'Dora',      colorClass: 'voice-lang-es',   lang: 'es', tooltip: 'ef_dora · Spanish female' },
  'pf_dora':    { label: 'Dora',      colorClass: 'voice-lang-pt',   lang: 'pt', tooltip: 'pf_dora · Portuguese female' },
  'jf_alpha':   { label: 'Alpha',     colorClass: 'voice-lang-ja',   lang: 'ja', tooltip: 'jf_alpha · Japanese female' },
  'kf_alpha':   { label: 'Alpha',     colorClass: 'voice-lang-ko',   lang: 'ko', tooltip: 'kf_alpha · Korean female' },
  'hf_alpha':   { label: 'Alpha',     colorClass: 'voice-lang-hi',   lang: 'hi', tooltip: 'hf_alpha · Hindi female' },
  'if_sara':    { label: 'Sara',      colorClass: 'voice-lang-it',   lang: 'it', tooltip: 'if_sara · Italian female' },
  'narrator':   { label: 'Narrator',  colorClass: 'voice-narrator',  lang: 'en', tooltip: 'narrator' },
  'student':    { label: 'Student',   colorClass: 'voice-student',   lang: 'en', tooltip: 'student' },
  'teacher':    { label: 'Teacher',   colorClass: 'voice-teacher',   lang: 'en', tooltip: 'teacher' },
  'scripture':  { label: 'Scripture', colorClass: 'voice-scripture', lang: 'en', tooltip: 'scripture' },
};

const KOKORO_LANG_PREFIX = {
  a: 'en', b: 'en', z: 'zh', f: 'fr', e: 'es',
  p: 'pt', j: 'ja', k: 'ko', h: 'hi', i: 'it',
};
const KOKORO_LANG_LABEL = {
  en: 'English', zh: 'Chinese', fr: 'French', es: 'Spanish',
  pt: 'Portuguese', ja: 'Japanese', ko: 'Korean', hi: 'Hindi', it: 'Italian',
};

function inferVoiceInfo(voice) {
  if (!voice) return { label: 'Narrator', colorClass: 'voice-narrator', lang: 'en', tooltip: 'narrator' };
  const m = voice.match(/^([a-z])([mf])_(.+)$/);
  if (m) {
    const lang = KOKORO_LANG_PREFIX[m[1]] || 'en';
    const gender = m[2] === 'f' ? 'female' : 'male';
    const name = m[3].replace(/_/g, ' ');
    const langLabel = KOKORO_LANG_LABEL[lang] || lang;
    const label = name.charAt(0).toUpperCase() + name.slice(1);
    return { label, colorClass: `voice-lang-${lang}`, lang, tooltip: `${voice} · ${langLabel} ${gender}` };
  }
  const label = voice.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  return { label, colorClass: 'voice-narrator', lang: 'en', tooltip: voice };
}

// ═══════════════════════════════════════════════════════════════════════
// AUDIO + TRANSCRIPT SYNC
// ═══════════════════════════════════════════════════════════════════════
const audioEl = document.getElementById('audioEl');
let segments = [];
let currentSegIdx = -1;

function msToTs(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadTranscript(data) {
  segments = data.segments || [];
  currentSegIdx = -1;
  const section = document.getElementById('transcriptSection');
  const empty   = document.getElementById('transcriptEmpty');

  if (!segments.length) {
    section.innerHTML = '';
    section.appendChild(empty);
    empty.style.display = 'block';
    return;
  }

  section.innerHTML = '';
  segments.forEach((seg, i) => {
    const info = VOICE_INFO[seg.voice] || inferVoiceInfo(seg.voice);
    const div = document.createElement('div');
    div.className = 'seg';
    div.dataset.idx = i;
    div.innerHTML =
      `<span class="seg-ts">${msToTs(seg.start_ms)}</span>` +
      `<span class="seg-voice ${info.colorClass}" title="${escHtml(info.tooltip)}">${escHtml(info.label)}</span>` +
      `<span class="seg-text" lang="${info.lang}">${escHtml(seg.text)}</span>` +
      `<button class="seg-speak" title="Speak with selected language">🔊</button>` +
      `<button class="seg-ask" title="Copy context for Claude">Ask</button>`;

    div.addEventListener('click', e => {
      if (e.target.classList.contains('seg-speak')) { speakText(seg.text, ttsLang, e.target); return; }
      if (e.target.classList.contains('seg-ask')) { askAt(i); return; }
      if (i === currentSegIdx) {
        if (audioEl.paused) audioEl.play();
        else audioEl.pause();
      } else {
        audioEl.currentTime = seg.start_ms / 1000;
        if (audioEl.paused) audioEl.play();
      }
    });
    section.appendChild(div);
  });

  const voices = new Set(segments.map(s => s.voice));
  section.classList.toggle('single-voice', voices.size <= 1);
}

audioEl.addEventListener('timeupdate', () => {
  const nowMs = audioEl.currentTime * 1000;
  let hitIdx = -1;
  for (let i = 0; i < segments.length; i++) {
    if (segments[i].start_ms <= nowMs && nowMs <= segments[i].end_ms) { hitIdx = i; break; }
  }
  if (hitIdx === currentSegIdx) return;
  currentSegIdx = hitIdx;

  const section = document.getElementById('transcriptSection');
  section.querySelectorAll('.seg.active').forEach(el => el.classList.remove('active'));
  if (hitIdx >= 0) {
    const el = section.querySelector(`.seg[data-idx="${hitIdx}"]`);
    if (el) {
      el.classList.add('active');
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
});


// ═══════════════════════════════════════════════════════════════════════
// AUTO-LOAD CODEPEN ASSETS ON PAGE LOAD
// ═══════════════════════════════════════════════════════════════════════
(async function autoLoad() {
  // Set the audio source directly — browser streams it
  audioEl.src = ASSET_MP3;
  document.getElementById('playerLabel').textContent = 'names.mp3';
  document.getElementById('fileLabel').textContent = '— names.mp3';

  // Fetch the transcript JSON
  try {
    const res = await fetch(ASSET_JSON);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    loadTranscript(data);
  } catch (err) {
    document.getElementById('transcriptEmpty').textContent = 'Could not load transcript: ' + err.message;
    document.getElementById('transcriptEmpty').style.display = 'block';
  }
})();


// ═══════════════════════════════════════════════════════════════════════
// ASK AT
// ═══════════════════════════════════════════════════════════════════════
function askAt(idx, contextN = 3) {
  const start = Math.max(0, idx - contextN);
  const end   = Math.min(segments.length - 1, idx + contextN);
  const ctx   = segments.slice(start, end + 1);

  const rawName = (audioEl.src || '').split('/').pop().replace(/\?.*$/, '');
  const title   = decodeURIComponent(rawName)
    .replace(/\.[^.]+$/, '').replace(/_/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase()) || 'Dialogue';

  const lines = [`[From "${title}" — at ${msToTs(segments[idx].start_ms)}]`, ''];
  ctx.forEach((seg, i) => {
    const marker = (start + i === idx) ? ' ◀ you are here' : '';
    lines.push(`[${msToTs(seg.start_ms)}] ${seg.voice.toUpperCase()}: ${seg.text}${marker}`);
  });
  lines.push('', '[Your question:]', '');

  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => showToast('Copied — paste into Claude chat'))
    .catch(() => showToast('Clipboard copy failed'));
}


// ═══════════════════════════════════════════════════════════════════════
// LOCAL FILE LOADING (override with your own files)
// ═══════════════════════════════════════════════════════════════════════
function handleLocalFiles(files) {
  let mp3 = null, json = null;
  for (const f of files) {
    const ext = f.name.slice(f.name.lastIndexOf('.')).toLowerCase();
    if (['.mp3','.m4a','.wav','.ogg','.flac'].includes(ext)) mp3 = f;
    if (ext === '.json') json = f;
  }
  if (mp3) {
    const url = URL.createObjectURL(mp3);
    audioEl.src = url;
    document.getElementById('playerLabel').textContent = mp3.name;
    document.getElementById('fileLabel').textContent = '— ' + mp3.name;
    audioEl.play();
  }
  if (json) {
    const reader = new FileReader();
    reader.onload = e => {
      try { loadTranscript(JSON.parse(e.target.result)); }
      catch { showToast('Could not parse JSON file'); }
    };
    reader.readAsText(json);
  }
  if (!mp3 && !json) showToast('Select an MP3 and/or JSON file');
}


// ═══════════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}


// ═══════════════════════════════════════════════════════════════════════
// FONT SIZE
// ═══════════════════════════════════════════════════════════════════════
let transcriptFontSize = 14;
function changeFontSize(delta) {
  transcriptFontSize = Math.min(26, Math.max(10, transcriptFontSize + delta));
  document.querySelectorAll('.seg-text').forEach(el => el.style.fontSize = transcriptFontSize + 'px');
}

// Keyboard seek shortcuts
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  const ap = document.getElementById('audioEl');
  if (!ap || !ap.src) return;

  if (e.key === '`' || e.key === 'q' || e.key === 'a' || e.key === 'z') { e.preventDefault(); ap.paused ? ap.play() : ap.pause(); return; }

  const row0 = { '1': 0, '2': 10, '3': 20, '4': 30, '5': 40, '6': 50 };
  if (e.key in row0) { e.preventDefault(); ap.currentTime = row0[e.key]; return; }

  const row1 = { w: 60, e: 70, r: 80, t: 90, y: 100, u: 110 };
  if (e.key in row1) { e.preventDefault(); ap.currentTime = row1[e.key]; return; }

  const row2 = { s: 120, d: 130, f: 140, g: 150, h: 160 };
  if (e.key in row2) { e.preventDefault(); ap.currentTime = row2[e.key]; return; }

  const row3 = { x: 180, c: 190, v: 200, b: 210, n: 220, m: 230 };
  if (e.key in row3) { e.preventDefault(); ap.currentTime = row3[e.key]; return; }
});
</script>
