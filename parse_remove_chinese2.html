<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Chinese / English</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1e1e1e; color: #ccc; display: flex; flex-direction: column; height: 100vh; padding: 16px; gap: 12px; }
  h1 { font-size: 1rem; color: #fff; }
  .row { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; flex: 1; gap: 6px; }
  label { font-size: 0.8rem; color: #888; }
  textarea { flex: 1; background: #2d2d2d; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 0.9rem; resize: none; }
  .buttons { display: flex; gap: 8px; align-items: center; }
  button { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  #parseBtn { background: #0070f3; color: #fff; }
  #parseBtn:hover { background: #0060d0; }
  #copyBtn { background: #333; color: #ccc; }
  #copyBtn:hover { background: #444; }
  #clearBtn { background: #333; color: #ccc; }
  #clearBtn:hover { background: #444; }
  #status { font-size: 0.8rem; color: #0a0; }
  #tsToggle { background: #333; color: #ccc; }
  #tsToggle:hover { background: #444; }
  #tsToggle.on { background: #b91c1c; color: #fff; }
</style>
</head>
<body>

<h1>Split Chinese / English from Transcript</h1>

<div class="row">
  <div class="col">
    <label>INPUT</label>
    <textarea id="input" placeholder="0:00 好,親愛的弟兄姊妹,祝你平安。 Alright, dear brothers and sisters, I wish you peace."></textarea>
  </div>
  <div class="col">
    <label>OUTPUT</label>
    <textarea id="output" readonly></textarea>
  </div>
</div>

<div class="buttons">
  <button id="parseBtn">Parse</button>
  <button id="tsToggle">Remove Timestamps: OFF</button>
  <button id="copyBtn">Copy Output</button>
  <button id="clearBtn">Clear</button>
  <span id="status"></span>
</div>

<script>
const CHINESE_RE = /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3000-\u303f\uff01-\uff65\uff00-\uffef，。！？、；：""''（）【】《》…—]+/g;

let removeTimestamps = false;

function splitLine(line) {
  if (!line.trim()) return null;

  const match = line.match(/^(\d+:\d+)\s+(.*)/);
  if (!match) return null;

  const rest = match[2];

  const chineseParts = rest.match(CHINESE_RE) || [];
  const chinese = chineseParts.join('').trim();

  const english = rest.replace(CHINESE_RE, '').replace(/^[,.\s]+/, '').replace(/\s+/g, ' ').trim();

  return { timestamp: match[1], chinese, english };
}

document.getElementById('tsToggle').addEventListener('click', () => {
  removeTimestamps = !removeTimestamps;
  const btn = document.getElementById('tsToggle');
  btn.textContent = `Remove Timestamps: ${removeTimestamps ? 'ON' : 'OFF'}`;
  btn.classList.toggle('on', removeTimestamps);
});

document.getElementById('parseBtn').addEventListener('click', () => {
  const lines = document.getElementById('input').value.split('\n');
  const output = [];

  for (const line of lines) {
    const parsed = splitLine(line);
    if (!parsed) continue;

    const { timestamp, chinese, english } = parsed;
    const prefix = removeTimestamps ? '' : `${timestamp} `;

    if (english) output.push(prefix + english);
    if (chinese) output.push(prefix + chinese);
    output.push('');
  }

  // Remove trailing blank line
  while (output.length && output[output.length - 1] === '') output.pop();

  document.getElementById('output').value = output.join('\n');
  document.getElementById('status').textContent = '';
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const out = document.getElementById('output').value;
  if (!out) return;
  navigator.clipboard.writeText(out).then(() => {
    document.getElementById('status').textContent = 'Copied!';
    setTimeout(() => document.getElementById('status').textContent = '', 1500);
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  document.getElementById('status').textContent = '';
});
</script>

</body>
</html>
