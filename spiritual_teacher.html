<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spiritual Teacher</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --muted:#aaa; --dim:#888; --ctl:#1c1c1c; --line:#444; --line2:#2c2c2c; --accent:#d4a84b; --card:#1a1a1a; --me:#1d3b66; --asst:#232323; --err:#5a1f1f; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: light; --bg:#f6f6f4; --fg:#1a1a1a; --muted:#555; --dim:#777; --ctl:#fff; --line:#c8c8c4; --line2:#ddd; --accent:#8a6410; --card:#fff; --me:#d6e6ff; --asst:#ececea; --err:#ffd9d9; }
  }
  :root[data-theme="light"] { color-scheme: light; --bg:#f6f6f4; --fg:#1a1a1a; --muted:#555; --dim:#777; --ctl:#fff; --line:#c8c8c4; --line2:#ddd; --accent:#8a6410; --card:#fff; --me:#d6e6ff; --asst:#ececea; --err:#ffd9d9; }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#111; --fg:#eee; --muted:#aaa; --dim:#888; --ctl:#1c1c1c; --line:#444; --line2:#2c2c2c; --accent:#d4a84b; --card:#1a1a1a; --me:#1d3b66; --asst:#232323; --err:#5a1f1f; }
  :root { --fs: 17; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; }
  select, button, input, textarea { background: var(--ctl); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
  button { cursor: pointer; min-height: 40px; }
  button.primary { background: #2a6fd6; border-color: #2a6fd6; color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; }
  .bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line2); flex-wrap: nowrap; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .bar > * { flex-shrink: 0; }
  .bar select { max-width: 150px; }
  .bar input.num { width: 64px; }
  .bar .sep { width: 1px; align-self: stretch; background: var(--line2); margin: 0 2px; }
  .sub { display: flex; align-items: center; gap: 8px; padding: 4px 12px 0; font-size: 12px; color: var(--accent); letter-spacing: .5px; flex-shrink: 0; }
  .status { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.settings { padding: 0 10px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line2); }
  details.settings summary { padding: 6px 0; cursor: pointer; }
  .setrow { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 8px; align-items: center; }
  .passage { margin: 6px 10px 0; border: 1px solid var(--line2); border-radius: 10px; background: var(--card); flex-shrink: 0; max-height: calc(6em + 16px); overflow-y: auto; padding: 8px 14px; font-family: Georgia, 'Times New Roman', serif; font-size: calc(var(--fs) * 1px); line-height: 1.5; overscroll-behavior: contain; }
  .passage.collapsed { max-height: 0; padding: 0 14px; border-width: 0; margin-top: 0; overflow: hidden; }
  .passage sup { color: var(--accent); font-size: 11px; margin-right: 3px; font-family: -apple-system, system-ui, sans-serif; }
  .passage .v { cursor: pointer; }
  .passage .v.sel { background: rgba(212,168,75,.25); border-radius: 3px; }
  .refbtn { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; min-height: 40px; }
  .refbtn:hover { background: #2563eb; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center; z-index: 10; padding: 16px; padding-top: 12vh; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; max-width: 460px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 14px 16px; font-size: 14px; line-height: 1.55; }
  .sheet h3 { font-size: 16px; margin-bottom: 8px; text-align: center; }
  .sheet input { width: 100%; font-size: 16px; }
  .sheet .err { color: #e5484d; font-size: 12px; min-height: 16px; margin-top: 4px; }
  .sheet .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .hist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .hist button { min-height: 34px; padding: 4px 12px; font-size: 13px; color: var(--accent); }
  .feed { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
  .empty { color: var(--dim); font-size: 14px; text-align: center; margin: auto; padding: 20px; line-height: 1.6; }
  .msg { max-width: 94%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; font-size: calc(var(--fs) * 1px - 1px); line-height: 1.6; }
  .msg.user { align-self: flex-end; background: var(--me); }
  .msg.assistant { align-self: flex-start; background: var(--asst); }
  .msg.err { background: var(--err); }
  .srcs { font-size: 11px; color: var(--dim); margin-top: 6px; line-height: 1.4; }
  .msg .copybtn { display: block; min-height: 28px; margin-top: 6px; padding: 2px 10px; font-size: 12px; color: var(--dim); background: transparent; border-radius: 6px; }
  .divider { align-self: center; font-size: 11px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .quick { display: flex; gap: 6px; padding: 0 10px 6px; overflow-x: auto; }
  .quick button { white-space: nowrap; min-height: 34px; font-size: 13px; padding: 4px 12px; border-radius: 999px; }
  .composer { border-top: 1px solid var(--line2); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; min-height: 48px; max-height: 140px; resize: none; font-size: 16px; line-height: 1.4; }
  .composer button { min-height: 48px; padding: 0 18px; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="bar">
  <button class="refbtn" id="refBtn" title="Go to a Bible reference (e)">Ref(e)</button>
  <select id="book" title="Book"></select>
  <select id="chap" title="Chapter"></select>
  <input class="num" id="vFrom" type="number" min="1" inputmode="numeric" placeholder="from" title="First verse (blank = whole chapter)">
  <input class="num" id="vTo" type="number" min="1" inputmode="numeric" placeholder="to" title="Last verse">
  <button id="togBtn" title="Show / hide the passage">Passage</button>
  <span class="sep"></span>
  <button id="fMinus" title="Smaller text">A−</button>
  <button id="fPlus" title="Larger text">A+</button>
  <button id="themeBtn" title="Light / dark"></button>
  <span class="sep"></span>
  <button id="gBtn" title="Sign in to Google to save / import">Google</button>
  <select id="recent" disabled title="Which Google Doc to save into / import from"><option value="">＋ New doc</option></select>
  <button id="exportBtn" title="Save this study to the chosen doc (new doc if ＋ New doc)">Save → Doc</button>
  <button id="importBtn" title="Load the chosen doc: a saved study resumes, any other doc becomes the text you read">Import</button>
  <button id="clearBtn">New</button>
</div>
<div class="sub"><span class="status" id="status"></span></div>
<details class="settings">
  <summary>Settings</summary>
  <div class="setrow">
    <label>Teacher <select id="style"></select></label>
    <label>Folder <input id="folder" type="text" placeholder="Drive folder link (blank = My Drive)" spellcheck="false" autocomplete="off" style="width:240px"></label>
    <input id="code" type="password" placeholder="Access code" autocomplete="off" style="width:130px">
    <label>Model <input id="model" list="models" value="gpt-4.1-mini" spellcheck="false" style="width:130px">
      <datalist id="models"><option value="gpt-4.1-mini"><option value="gpt-4.1"><option value="gpt-4o-mini"><option value="gpt-5-mini"><option value="gpt-5"></datalist></label>
  </div>
</details>
<div class="modal" id="refModal"><div class="sheet">
  <h3>Go to Reference</h3>
  <input id="refInput" type="text" placeholder="e.g. Romans 8, John 3:16-21, 1 Cor 13" spellcheck="false" autocomplete="off" autocapitalize="off">
  <div class="err" id="refErr"></div>
  <div class="hist" id="refHist"></div>
  <div class="hint">Enter = go · Esc = close · press <b>e</b> anywhere to open</div>
</div></div>
<div class="passage" id="passage"></div>
<div class="feed" id="feed">
  <div class="empty" id="empty">Choose a passage above, then ask about it.<br>Tap verse numbers in the passage to focus a question on just those verses.</div>
</div>
<div class="quick" id="quick"></div>
<div class="composer">
  <textarea id="inp" rows="1" placeholder="Ask about this passage…" autocapitalize="sentences"></textarea>
  <button id="pasteBtn" title="Paste the clipboard into the question box">Paste</button>
  <button class="primary" id="go">Ask</button>
</div>

<script>
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const BOOKS = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];

const STYLES = {
  pastor: { name: 'Pastor', sys: 'You are a warm, wise pastor. Explain what the passage meant and how it can be lived out today, in plain, encouraging language. Be practical and personal, and gently honest where the text is challenging.' },
  scholar: { name: 'Scholar', sys: 'You are a careful Bible scholar. Give historical, cultural, literary and original-language background (Hebrew/Greek words, genre, audience, structure), and note where reputable interpreters differ. Stay accessible; define any technical term you use.' },
  socratic: { name: 'Socratic', sys: 'You are a Socratic spiritual guide. Do not lecture. Answer briefly, then lead the reader deeper with one or two probing questions about what the text actually says, so they discover meaning themselves. Offer a direct answer if they ask for one.' },
  devotional: { name: 'Devotional', sys: 'You are a contemplative devotional guide. Help the reader slow down with the passage: point to one image or phrase to dwell on, connect it to the heart, and close with a short reflection or prayer prompt. Gentle, unhurried, brief.' }
};
const RULES = 'Ground every answer in the passage given below. Cite verse numbers (e.g. "v. 5") when you draw on a verse. Clearly separate what the text says from interpretation, and say so when Christians disagree. If the question goes beyond the passage, answer from the wider Bible and say you are doing so. Be concise (a few short paragraphs at most) and never invent verses or quotations. Speak to the reader directly.';
const QUICK = ['What is the main point?', 'Explain the context', 'Hard words or phrases?', 'How does this apply to me?', 'Related passages?'];

let gDoc = null, exported = 0;
let BIBLE = null, INTRO = null, NOTES = null, passageText = '', passageRef = '', selVerses = new Set();
let curView = null;   // { bi, ch, a, z } of the passage on screen
const turns = []; let busy = false;

// ── setup ──
BOOKS.forEach((b, i) => { const o = document.createElement('option'); o.value = i; o.textContent = b; $('book').appendChild(o); });
for (const k of Object.keys(STYLES)) { const o = document.createElement('option'); o.value = k; o.textContent = STYLES[k].name; $('style').appendChild(o); }
$('style').value = STYLES[ls.get('st-style', 'pastor')] ? ls.get('st-style', 'pastor') : 'pastor';
$('style').onchange = () => ls.set('st-style', $('style').value);
$('code').value = ls.get('ocr-access-code', '');   // shared with tutor.html / translator.html
$('code').onchange = () => ls.set('ocr-access-code', $('code').value.trim());
$('model').value = ls.get('st-model', 'gpt-4.1-mini');
$('model').onchange = () => ls.set('st-model', $('model').value.trim());
let fs = Math.max(13, Math.min(30, parseInt(ls.get('st-fs', '17'), 10) || 17));
function applyFs() { document.documentElement.style.setProperty('--fs', fs); ls.set('st-fs', fs); }
$('fMinus').onclick = () => { fs = Math.max(13, fs - 1); applyFs(); };
$('fPlus').onclick = () => { fs = Math.min(30, fs + 1); applyFs(); };
applyFs();
function isLight() { const t = document.documentElement.dataset.theme; return t ? t === 'light' : matchMedia('(prefers-color-scheme: light)').matches; }
function applyTheme(t) { document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'light' ? '☾' : '☀︎'; ls.set('st-theme', t); }
applyTheme(ls.get('st-theme', '') || (isLight() ? 'light' : 'dark'));
$('themeBtn').onclick = () => applyTheme(isLight() ? 'dark' : 'light');
function setStatus(t) { $('status').textContent = t || ''; }
QUICK.forEach(q => { const b = document.createElement('button'); b.textContent = q; b.onclick = () => { $('inp').value = q; ask(); }; $('quick').appendChild(b); });

function fillChapters() {
  const n = BIBLE ? BIBLE[$('book').value].chapters.length : 1;
  $('chap').innerHTML = ''; for (let c = 1; c <= n; c++) { const o = document.createElement('option'); o.value = c; o.textContent = 'Ch ' + c; $('chap').appendChild(o); }
}
function showPassage(fromChange) {
  if (!BIBLE) return;
  const bi = +$('book').value, ch = +$('chap').value, verses = BIBLE[bi].chapters[ch - 1] || [];
  let a = parseInt($('vFrom').value, 10) || 1, z = parseInt($('vTo').value, 10) || (parseInt($('vFrom').value, 10) ? a : verses.length);
  a = Math.max(1, Math.min(a, verses.length)); z = Math.max(a, Math.min(z, verses.length));
  customText = false; selVerses = new Set(); curView = { bi, ch, a, z };
  passageRef = BOOKS[bi] + ' ' + ch + (a === 1 && z === verses.length ? '' : ':' + a + (z > a ? '-' + z : ''));
  const box = $('passage'); box.innerHTML = '';
  const lines = [];
  for (let v = a; v <= z; v++) {
    const t = (verses[v - 1] || '').trim(); if (!t) continue;
    lines.push(v + ' ' + t);
    const sp = document.createElement('span'); sp.className = 'v'; sp.dataset.v = v;
    sp.innerHTML = '<sup>' + v + '</sup>'; sp.appendChild(document.createTextNode(t + ' '));
    sp.onclick = () => { if (selVerses.has(v)) { selVerses.delete(v); sp.classList.remove('sel'); } else { selVerses.add(v); sp.classList.add('sel'); } updateFocus(); };
    box.appendChild(sp);
  }
  passageText = lines.join('\n'); box.scrollTop = 0;
  ls.set('st-ref', JSON.stringify({ b: bi, c: ch, f: $('vFrom').value, t: $('vTo').value }));
  if (fromChange && turns.length) { const d = document.createElement('div'); d.className = 'divider'; d.textContent = '— now reading ' + passageRef + ' —'; $('feed').appendChild(d); scrollFeed(); }
  setStatus(passageRef + ' · WEB');
}
function showCustom(name, text) {
  customText = true; curView = null; passageRef = name; passageText = text; selVerses = new Set();
  const box = $('passage'); box.innerHTML = ''; box.textContent = text; box.scrollTop = 0; box.classList.remove('collapsed');
  setStatus(name + ' · imported text');
}
function updateFocus() { setStatus(selVerses.size ? passageRef + ' · focus v. ' + [...selVerses].sort((x, y) => x - y).join(', ') : passageRef + ' · WEB'); }
function scrollFeed() { $('feed').scrollTop = $('feed').scrollHeight; }
$('book').onchange = () => { fillChapters(); $('vFrom').value = ''; $('vTo').value = ''; showPassage(true); };
$('chap').onchange = () => { $('vFrom').value = ''; $('vTo').value = ''; showPassage(true); };
$('vFrom').onchange = $('vTo').onchange = () => showPassage(true);
$('togBtn').onclick = () => $('passage').classList.toggle('collapsed');
$('clearBtn').onclick = () => { turns.length = 0; exported = 0; gDoc = null; $('recent').value = ''; $('feed').innerHTML = ''; };

// ── chat ──
let customText = false;
function BIBLE_REF_OK() { return !customText; }
function passageInfo() { return { label: passageRef, code: $('book').value + '|' + $('chap').value + '|' + $('vFrom').value + '|' + $('vTo').value }; }
// ── background context: book outline (bible_intro.json) + reader's own study notes (study_notes.json) ──
// Outline lines look like "E. Retribution on Midian (31:1–54)"; depth comes from the marker (I. / A. / 1. / a.).
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function outlineLines(text) {
  const out = []; let romanNext = 0;
  for (const raw of text.split(/\r?\n/)) {
    const t = raw.trim(); if (!t) continue;
    const m = t.match(/^([IVX]+|[A-Z]|\d+|[a-z])\.\s/);
    if (!m) { if (out.length) out[out.length - 1].text += ' ' + t; continue; }   // wrapped continuation
    const k = m[1];   // "I." is a roman numeral only when it is the next expected one, else a letter heading
    let depth;
    if (/^[IVXL]+$/.test(k) && k === ROMAN[romanNext]) { depth = 0; romanNext++; }
    else depth = /^[A-Z]$/.test(k) ? 1 : /^\d+$/.test(k) ? 2 : 3;
    out.push({ depth, text: t.replace(/\(\s+/g, '(').replace(/\s+\)/g, ')') });
  }
  out.forEach(l => {   // first/last chapter this line covers (single-chapter books have no "ch:v")
    const r = l.text.match(/\((\d+):\d+(?:[–-](?:(\d+):)?\d+)?/) || l.text.match(/\((\d+)[–-]\d+/);
    const one = r && r[0].includes(':');
    l.c1 = r ? (one ? +r[1] : 1) : null; l.c2 = r ? (r[2] ? +r[2] : l.c1) : null;
  });
  return out;
}
function bookContext(v) {
  if (!v) return '';
  const parts = [];
  if (INTRO) {
    const abbr = BIBLE[v.bi].abbrev, raw = INTRO[abbr];
    if (raw) {
      const L = outlineLines(raw), hit = l => l.c1 != null && l.c1 <= v.ch && l.c2 >= v.ch;
      if (L.some(l => l.depth === 0)) {
        const map = L.filter(l => l.depth === 0).map(l => l.text);
        const sec = []; let keep = false, prevHead = null, nextWanted = false;
        L.forEach((l, i) => {
          if (l.depth <= 1) {
            if (nextWanted) { if (!sec.includes(l.text)) sec.push(l.text); nextWanted = false; }
            keep = l.depth === 1 && hit(l);
            if (keep) { if (prevHead && !sec.includes(prevHead)) sec.push(prevHead); if (!sec.includes(l.text)) sec.push(l.text); nextWanted = true; }
            if (l.depth === 1) prevHead = l.text;
          } else if (keep && hit(l)) sec.push('   '.repeat(l.depth - 1) + l.text);
        });
        parts.push('Book outline of ' + BOOKS[v.bi] + ':\n' + map.join('\n') + (sec.length ? '\n\nWhere chapter ' + v.ch + ' sits:\n' + sec.join('\n') : ''));
      } else parts.push('Book outline of ' + BOOKS[v.bi] + ':\n' + raw.trim().slice(0, 1500));
    }
  }
  return parts.length ? '\n\nBackground for chapter ' + v.ch + ':\n' + parts.join('\n\n') : '';
}
// ── RAG: retrieve commentary chunks (Barnes, Matthew Henry, reader's Logos notes) for THIS question ──
// Per-book chunk files live in /commentary/<abbrev>.json: [{ c, f, t, src, title, text }] (t = 0: chapter overview).
const COMM = {};   // abbrev -> { chunks, df, avgdl, N } once loaded; null when the book has no file
const STOP = new Set('a an the and or but if of to in on at by for with from as is are was were be been being it its this that these those he she they them his her their you your i me my we our us not no do does did so than then there what why how when who whom which can could would should may might will shall about into over under after before also just very more most some any'.split(' '));
function toks(str) {
  return (str.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => !STOP.has(w) && w.length > 1)
    .map(w => w.replace(/(ing|ed|es|ly|s)$/, m => w.length - m.length >= 4 ? '' : m));
}
const META = new Set('explain context reading read chapter passage verse verses mean meaning summary summarize overview text tell say out up number numbers please give show help understand'.split(' '));
async function loadComm(abbr) {
  if (abbr in COMM) return COMM[abbr];
  COMM[abbr] = null;   // mark in-flight/missing so a failed fetch is not retried on every question
  try {
    await notesReady;
    const r = await fetch('/commentary/' + abbr + '.json').catch(() => null);
    const chunks = r && r.ok ? await r.json() : [];   // a book with no commentary file can still use the reader's notes
    const nb = NOTES && NOTES[abbr] || {};
    for (const ch of Object.keys(nb)) for (const n of nb[ch]) {
      if (!n.q || !n.a || /^paste the logos/i.test(n.a)) continue;
      const m = String(n.verses || '').match(/(\d+)(?:\s*[-–]\s*(\d+))?/);
      chunks.push({ c: +ch, f: m ? +m[1] : 1, t: m ? +(m[2] || m[1]) : 0, src: "Reader's Logos notes", title: '', text: 'Q: ' + n.q + '\nA: ' + n.a });
    }
    if (!chunks.length) return null;
    const df = {}; let tot = 0;
    chunks.forEach(k => { k.tk = toks(k.title + ' ' + k.text); tot += k.tk.length; new Set(k.tk).forEach(w => { df[w] = (df[w] || 0) + 1; }); });
    return (COMM[abbr] = { chunks, df, avgdl: tot / (chunks.length || 1), N: chunks.length });
  } catch (e) { return null; }
}
function chunkLabel(k) {
  const vs = k.t === 0 ? '' : k.f === k.t ? ', v. ' + k.f : k.f ? ', vv. ' + k.f + '-' + k.t : '';
  return k.src === 'Matthew Henry' ? 'Matthew Henry' + (k.title ? ', "' + k.title + '"' : '') + vs : k.src + vs;
}
// BM25 over the chunks that speak to the passage on screen; prior question added so follow-ups ("what contradiction?") keep their topic
async function retrieve(question) {
  const v = curView; if (!v || !BIBLE) return [];
  const db = await loadComm(BIBLE[v.bi].abbrev); if (!db) return [];
  const lastU = turns.filter(t => t.role === 'user').slice(-1)[0], lastA = turns.filter(t => t.role === 'assistant').slice(-1)[0];

  if (f && f > n) return { err: BOOKS[idx] + ' ' + ch + ' has ' + n + ' verses' };
  if (f && z && z < f) z = f;
  return { idx, ch, f: f || '', z: z || '' };
}
function refLabel(r) { return BOOKS[r.idx] + ' ' + r.ch + (r.f ? ':' + r.f + (r.z && r.z > r.f ? '-' + r.z : '') : ''); }
let refHist = []; try { refHist = JSON.parse(ls.get('st-refhist', '[]')) || []; } catch (e) { refHist = []; }
function paintHist() {
  const box = $('refHist'); box.innerHTML = '';
  refHist.forEach(txt => { const b = document.createElement('button'); b.textContent = txt; b.onclick = () => goRef(txt); box.appendChild(b); });
}
function openRef() { $('refErr').textContent = ''; $('refInput').value = ''; paintHist(); $('refModal').classList.add('show'); setTimeout(() => $('refInput').focus(), 0); }
function closeRef() { $('refModal').classList.remove('show'); }
function goRef(str) {
  if (!BIBLE) { $('refErr').textContent = 'Bible is still loading'; return; }
  const r = parseRef(str);
  if (!r) { $('refErr').textContent = 'Not a reference: try "Romans 8" or "John 3:16-21"'; return; }
  if (r.err) { $('refErr').textContent = r.err; return; }
  $('book').value = r.idx; fillChapters(); $('chap').value = r.ch; $('vFrom').value = r.f; $('vTo').value = r.z;
  showPassage(true); $('passage').classList.remove('collapsed');
  const label = refLabel(r); refHist = [label].concat(refHist.filter(x => x !== label)).slice(0, 12); ls.set('st-refhist', JSON.stringify(refHist));
  closeRef();
}
$('refBtn').onclick = openRef;
$('refInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goRef($('refInput').value); } });
$('refModal').addEventListener('click', e => { if (e.target === $('refModal')) closeRef(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeRef(); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(tag) && !$('refModal').classList.contains('show')) { e.preventDefault(); openRef(); }
});

// ── optional background data; the page works without either file ──
fetch('/bible_intro.json').then(r => r.ok ? r.json() : null).then(d => { INTRO = d; }).catch(() => {});
const notesReady = fetch('/study_notes.json').then(r => r.ok ? r.json() : null).then(d => { NOTES = d; }).catch(() => {});

// ── load Bible (World English Bible, public domain) ──
fetch('/bible_web.json').then(r => r.json()).then(d => {
  BIBLE = d;
  let saved = {}; try { saved = JSON.parse(ls.get('st-ref', '{}')) || {}; } catch (e) {}
  $('book').value = saved.b != null ? saved.b : 42;   // John
  fillChapters(); $('chap').value = saved.c || 1; $('vFrom').value = saved.f || ''; $('vTo').value = saved.t || '';
  showPassage(false);
}).catch(e => setStatus('Could not load Bible: ' + e.message));
</script>
</body>
