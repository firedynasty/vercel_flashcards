<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blink</title>
<style>
  :root { --bg:#14141c; --panel:#1d1d2b; --fg:#e8e8f0; --muted:#9a9ab0; --accent:#c9a84c; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body {
    display: flex; flex-direction: column; gap: 8px; padding: 10px;
    height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ---- blink bar ---- */
  .bar { flex: none; display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 10px 14px; }
  #dot { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #3a1210; }
  .ctl { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #bpmLabel { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #bpmLabel small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .row label { margin-left: auto; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); touch-action: pan-x; }
  button.sync {
    flex: none; padding: 12px 18px; border: 0; border-radius: 10px;
    background: var(--accent); color: #1a1a2e; font: 700 15px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer;
  }
  button.sync:active { transform: scale(.96); }

  /* ---- game box (top) ---- */
  #arena { position: relative; flex: 1 1 0; min-height: 0; border-radius: 12px; background: #0e0e16; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hint { position: absolute; top: 8px; left: 12px; font-size: 11px; color: var(--muted); pointer-events: none; }
  #score { position: absolute; top: 8px; right: 12px; font: 700 14px -apple-system, sans-serif; color: var(--accent); pointer-events: none; font-variant-numeric: tabular-nums; }
  #dbg { position: absolute; bottom: 4px; left: 8px; font: 10px monospace; color: #6c6; pointer-events: none; display: none; }

  .btns { flex: none; display: flex; flex-direction: column; gap: 6px; }
  #cc .small.wait.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* ---- Claude / OpenAI chat panel (bottom half, always loaded) ---- */
  #cc { position: relative; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid #34344a; touch-action: pan-y; }
  #cc .top { flex: none; display: flex; align-items: center; gap: 8px; }
  #cc .top b { font-size: 15px; }
  #cc button, #cc input { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
  #cc .small { padding: 6px 12px; border: 1px solid #44445e; border-radius: 8px; background: #2b2b40; color: var(--fg); cursor: pointer; }
  #cc .small.on { color: #4da3ff; border-color: #4da3ff; }
  #ccStatus { flex: none; min-height: 14px; font-size: 12px; color: #e8a33c; }
  #ccRows { flex: none; max-height: 30%; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .srow { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 8px; border-radius: 8px; background: #151522; font-size: 13px; }
  .srow.working { border-left: 3px solid var(--accent); }
  .srow.done { border-left: 3px solid #34c759; }
  .srow .proj { font-weight: 700; }
  .srow .tm { color: var(--muted); font-variant-numeric: tabular-nums; }
  .srow .tx { flex-basis: 100%; color: var(--muted); font-size: 12px; max-height: 3.4em; overflow: hidden; }
  #ccLog { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; user-select: text; -webkit-user-select: text; }
  .msg { padding: 8px 10px; border-radius: 10px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; max-width: 92%; }
  .msg.user { align-self: flex-end; background: #2b3a5a; }
  .msg.ai { align-self: flex-start; background: #232336; }
  #cc .ask { flex: none; display: flex; gap: 6px; }
  #cc .ask input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid #44445e; background: #11111a; color: var(--fg); }
  #ccCode { width: 110px; padding: 6px 8px; border-radius: 8px; border: 1px solid #44445e; background: #11111a; color: var(--fg); }

  /* short landscape phones: tighter bar */
  @media (max-height: 470px) and (orientation: landscape) {
    .bar { padding: 6px 10px; }
    #dot { width: 40px; height: 40px; }
    button.sync { padding: 8px 14px; }
  }
</style>
</head>
<body>
  <div class="bar">
    <div id="dot"></div>
    <div class="ctl">
      <div class="row">
        <span id="bpmLabel">80<small>BPM</small></span>
        <label><input type="checkbox" id="clickBox"> click</label>
      </div>
      <input type="range" id="slider" min="30" max="105" step="1" value="80">
    </div>
    <div class="btns">
      <button class="sync" id="syncBtn" title="Restart the beat right now (Space)">Sync</button>
    </div>
  </div>

  <div id="arena">
    <canvas id="cv"></canvas>
    <div class="hint">arrow keys / WASD &middot; Space = Sync &middot; grab the grapes</div>
    <div id="score"></div>
    <div id="dbg"></div>
  </div>

  <div id="cc">
    <div class="top">
      <b>Claude Code</b>
      <button class="small" id="dbxBtn">Dropbox</button>
      <input id="ccCode" type="password" placeholder="Access code" autocomplete="off">
      <button class="small wait" id="waitBtn" title="Highlights until Claude / OpenAI responds">Wait</button>
    </div>
    <div id="ccStatus"></div>
    <div id="ccRows"></div>
    <div id="ccLog"></div>
    <div class="ask">
      <input id="ccIn" placeholder="Ask about what's going on&hellip;" autocomplete="off">
      <button class="small" id="ccSend">Send</button>
    </div>
  </div>

<script>
(function () {
  var MIN = 30, MAX = 105;
  var $ = function (id) { return document.getElementById(id); };
  var dbg = $('dbg'), DEBUG = /[?&]debug=1/.test(location.search);
  if (DEBUG) dbg.style.display = 'block';
  function log(s) { if (DEBUG) dbg.textContent = s; }

  // ---------- blink metronome (always on) ----------
  var dot = $('dot'), slider = $('slider'), label = $('bpmLabel'), clickBox = $('clickBox');
  var best = 0;
  var bpm = 80, clickOn = false, ctx = null, nextBeat = 0, flashes = [];
  var level = 0;                                   // current flash level 0..1, shared with the ball

  // gradient line along the top: one sweep = 4 beats, rate follows bpm (60 bpm = 4 s per sweep)
  var gradAnim = null;
  (function () {
    var line = document.createElement('div');
    line.style.cssText = 'position:fixed;top:0;left:0;right:0;height:3px;z-index:50;pointer-events:none;' +
      'background:linear-gradient(90deg,#d62828,#ffffff,#111111,#ffd60a,#111111,#1d4ed8,#ffffff,#d62828);background-size:200% 100%';
    document.body.appendChild(line);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      gradAnim = line.animate([{ backgroundPosition: '0 0' }, { backgroundPosition: '-200% 0' }],
        { duration: 4000, iterations: Infinity, easing: 'linear' });
    }
  })();

  try {
    var s = JSON.parse(localStorage.getItem('blinkPage') || '{}');
    if (s.bpm) bpm = s.bpm;
    clickOn = !!s.click; best = s.best || 0;
  } catch (e) {}

  function save() { try { localStorage.setItem('blinkPage', JSON.stringify({ bpm: bpm, click: clickOn, best: best })); } catch (e) {} }
  function setBpm(v) {
    bpm = Math.max(MIN, Math.min(MAX, Math.round(v)));
    slider.value = bpm; label.firstChild.nodeValue = bpm; save();
    if (gradAnim) gradAnim.updatePlaybackRate(bpm / 60);
  }
  setBpm(bpm); clickBox.checked = clickOn;

  function nowS() { return performance.now() / 1000; }
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state !== 'running') ctx.resume();
    return ctx;
  }
  function click(t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 1500;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.08);
  }

  // beats live on the page clock so the blink never depends on audio being unlocked;
  // the optional click rides the audio clock only once audio is running
  setInterval(function () {
    var now = nowS();
    if (!nextBeat || nextBeat < now - 0.5) nextBeat = now + 0.05;
    while (nextBeat < now + 0.15) {
      flashes.push(nextBeat);
      if (clickOn && ctx && ctx.state === 'running') click(ctx.currentTime + (nextBeat - now));
      nextBeat += 60 / bpm;
    }
  }, 25);

  function sync() { flashes.length = 0; nextBeat = nowS(); if (gradAnim) gradAnim.currentTime = 0; if (clickOn) getCtx(); }

  slider.addEventListener('input', function () { setBpm(+slider.value); });
  clickBox.addEventListener('change', function () { clickOn = clickBox.checked; if (clickOn) getCtx(); save(); });
  $('syncBtn').addEventListener('click', function () { sync(); this.blur(); });
  // a saved "click on" needs one gesture before the browser lets audio start
  document.addEventListener('pointerdown', function () { if (clickOn) getCtx(); });

  // ---------- Claude activity panel ----------
  // Reads the one-file snapshot claude_hooks_server/upload.js keeps in Dropbox (/vercel/claude_activity.json,
  // rebuilt from the last 24h and overwritten, so nothing piles up). Chat goes through /api/tutor.
  var SNAP = '/vercel/claude_activity.json', STALE = 2 * 3600 * 1000, MODEL = 'gpt-4.1';
  var cc = $('cc'), ccRows = $('ccRows'), ccLog = $('ccLog'), ccIn = $('ccIn'), ccCode = $('ccCode');
  var ccOpen = true, dbxToken = null, snap = null, unseen = 0, firstSnap = true, seen = {}, chat = [], chatBusy = false, TITLE0 = document.title;
  try { ccCode.value = localStorage.getItem('blinkCode') || ''; } catch (e) {}
  ccCode.addEventListener('change', function () { try { localStorage.setItem('blinkCode', ccCode.value.trim()); } catch (e) {} });
  function ccStatus(t) { $('ccStatus').textContent = t || ''; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtClock(ms) { var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ':' + pad2(m) + ':' + pad2(s % 60) : m + ':' + pad2(s % 60); }
  function clock(ms) { return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

  // --- Dropbox sign-in (popup + postMessage, same flow as dropboxImageLoader; token stays in memory) ---
  // The page's own URL must be a redirect URI of the Dropbox app.
  function dbxKey() {
    if (['localhost', '127.0.0.1'].indexOf(location.hostname) >= 0) {
      var k = localStorage.getItem('dropbox-app-key') || '';
      if (!k) { k = prompt('Dropbox App Key:') || ''; if (k) localStorage.setItem('dropbox-app-key', k); }
      return Promise.resolve(k);
    }
    return fetch('/api/dropbox-key').then(function (r) { return r.json(); }).then(function (j) { return j.key || ''; }).catch(function () { return ''; });
  }
  function b64url(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function dbxAuthBtn() {
    var b = $('dbxBtn');
    b.textContent = dbxToken ? '● Dropbox' : 'Dropbox'; b.classList.toggle('on', !!dbxToken);
    b.title = dbxToken ? 'Connected — click to sign out' : 'Sign in to Dropbox';
  }
  function dbxSignIn() {
    if (dbxToken) {
      fetch('https://api.dropboxapi.com/2/auth/token/revoke', { method: 'POST', headers: { Authorization: 'Bearer ' + dbxToken } }).catch(function () {});
      dbxToken = null; snap = null; dbxAuthBtn(); renderRows(); return;
    }
    dbxKey().then(function (key) {
      if (!key) { ccStatus('Dropbox app key not configured'); return; }
      var v = b64url(crypto.getRandomValues(new Uint8Array(64)));
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (d) {
        var uri = location.origin + location.pathname;
        var url = 'https://www.dropbox.com/oauth2/authorize?client_id=' + key + '&response_type=code&code_challenge=' + b64url(d) +
          '&code_challenge_method=S256&redirect_uri=' + encodeURIComponent(uri) + '&token_access_type=online';
        localStorage.setItem('blink_dbx_verifier', v);
        var pop = window.open(url, 'dropbox_auth', 'width=520,height=680,scrollbars=yes,resizable=yes');
        if (!pop) { sessionStorage.setItem('blink_dbx_verifier', v); location.href = url; }
      });
    });
  }
  // runs in the popup (or the page itself when popups are blocked) after Dropbox redirects back with ?code=
  (function dbxRedirect() {
    var code = new URLSearchParams(location.search).get('code');
    if (!code) return;
    var v = localStorage.getItem('blink_dbx_verifier') || sessionStorage.getItem('blink_dbx_verifier');
    dbxKey().then(function (key) {
      if (!v || !key) return;
      return fetch('https://api.dropboxapi.com/oauth2/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ code: code, grant_type: 'authorization_code', client_id: key, redirect_uri: location.origin + location.pathname, code_verifier: v }).toString()
      }).then(function (r) { return r.json(); }).then(function (d) {
        localStorage.removeItem('blink_dbx_verifier'); sessionStorage.removeItem('blink_dbx_verifier');
        if (!d.access_token) { if (window.opener) window.close(); return; }
        if (window.opener && !window.opener.closed) { window.opener.postMessage({ dropboxToken: d.access_token }, location.origin); window.close(); return; }
        dbxToken = d.access_token; history.replaceState({}, document.title, location.pathname); dbxAuthBtn(); openCc(); pollSnap();
      });
    }).catch(function () { if (window.opener) window.close(); });
  })();
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.dropboxToken) return;
    dbxToken = e.data.dropboxToken; dbxAuthBtn(); ccStatus(''); pollSnap();
  });
  $('dbxBtn').addEventListener('click', dbxSignIn);
  dbxAuthBtn();

  // --- snapshot polling ---
  function liveSessions() {
    var now = Date.now();
    return ((snap && snap.sessions) || []).filter(function (s) { return !(s.state === 'working' && now - s.lastTs > STALE); });
  }
  function pollSnap() {
    if (!dbxToken) return;
    fetch('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { Authorization: 'Bearer ' + dbxToken, 'Dropbox-API-Arg': JSON.stringify({ path: SNAP }) } })
      .then(function (r) {
        if (r.status === 401) { dbxToken = null; dbxAuthBtn(); ccStatus('Dropbox session expired — sign in again'); return null; }
        if (r.status === 409) { ccStatus('No activity file in Dropbox yet — is the hook uploader running?'); return null; }
        if (!r.ok) throw new Error('Dropbox ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j) return;
        snap = j; ccStatus('');
        liveSessions().forEach(function (s) {
          var prev = seen[s.session];
          if (!firstSnap && s.state === 'done' && (!prev || prev.finishedAt !== s.finishedAt)) waitOff();   // a Claude Code run just finished
          seen[s.session] = { state: s.state, finishedAt: s.finishedAt };
        });
        firstSnap = false; renderRows(); badge();
      })
      .catch(function (e) { ccStatus('Dropbox: ' + e.message); });
  }
  setInterval(function () { if (!document.hidden) pollSnap(); }, 4000);

  function badge() {}                                // chat is always on screen, no unread badge
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function renderRows() {
    ccRows.innerHTML = '';
    var list = liveSessions();
    if (!list.length) { ccRows.appendChild(el('div', 'srow', dbxToken ? 'Nothing reported in the last day' : 'Sign in to Dropbox to see Claude Code sessions')); return; }
    list.sort(function (a, b) { return (b.state === 'working') - (a.state === 'working') || b.lastTs - a.lastTs; });
    list.forEach(function (s) {
      var row = el('div', 'srow ' + s.state);
      row.appendChild(el('span', 'proj', (s.state === 'working' ? '⏱ ' : '✓ ') + s.project));
      var t = el('span', 'tm'); if (s.state === 'working') t.dataset.start = s.startedAt; else t.textContent = 'took ' + fmtClock(s.finishedAt - s.startedAt) + ' · ' + clock(s.finishedAt);
      row.appendChild(t);
      var lp = s.events.filter(function (e) { return e.e === 'UserPromptSubmit'; }).pop();
      var txt = s.state === 'done' && s.reply ? s.reply : (lp && lp.d) || '';
      if (txt) row.appendChild(el('span', 'tx', txt));
      ccRows.appendChild(row);
    });
    tickCc();
  }
  function tickCc() {
    var now = Date.now(), oldest = 0, n = 0;
    [].forEach.call(document.querySelectorAll('[data-start]'), function (e) { e.textContent = fmtClock(now - Number(e.dataset.start)); });
    liveSessions().forEach(function (s) { if (s.state === 'working') { n++; if (!oldest || s.startedAt < oldest) oldest = s.startedAt; } });
    document.title = (unseen ? '✓' + unseen + ' ' : '') + (n ? '⏱ ' + (n > 1 ? n + ' · ' : '') + fmtClock(now - oldest) : '') || TITLE0;
  }
  setInterval(tickCc, 1000);

  function openCc() { renderRows(); }
  // Wait button: click to light its border; it clears when a Claude Code run finishes or a chat reply completes
  var waitBtn = $('waitBtn');
  function waitOff() { waitBtn.classList.remove('on'); }
  waitBtn.addEventListener('click', function () { this.classList.toggle('on'); this.blur(); });
  renderRows();                                      // panel is on screen from load

  // --- chat: the model only sees what the snapshot holds (prompts, tool names, file/folder names, short command heads, last reply) ---
  function evLine(e) {
    var what = e.e === 'UserPromptSubmit' ? 'USER PROMPT: ' + (e.d || '') : e.e === 'Stop' ? 'finished' : e.e === 'Notification' ? 'notification: ' + (e.d || '') :
      e.tool ? e.tool + (e.d ? ' ' + e.d : '') : e.e;
    return clock(e.t) + ' ' + (e.a ? '[' + e.a + '] ' : '') + what;
  }
  function ccSystem() {
    var parts = [
      'You are a friendly assistant who helps the user keep track of Claude Code sessions running on their computer while they wait.',
      'You only know the activity log below: the user\'s prompts (cut to 500 characters), tool names, file and folder names, the first part of shell commands, and the last reply of finished sessions (cut to 1000 characters).',
      'You cannot see code, diffs, tool results or full replies. If asked about something the log does not cover, say so and suggest what to check. Never invent details.',
      'Keep answers short (2-5 sentences) and plain. Current time: ' + clock(Date.now()) + '.', ''];
    var list = liveSessions();
    if (!list.length) parts.push('(no sessions logged in the last day)');
    list.forEach(function (s) {
      parts.push('## Session in project "' + s.project + '": ' + s.state + ', started ' + clock(s.startedAt) + (s.state === 'done' ? ', finished ' + clock(s.finishedAt) : ''));
      parts.push('Activity (oldest first):');
      s.events.slice(-30).forEach(function (e) { parts.push(evLine(e)); });
      if (s.reply) parts.push('Claude\'s last reply: ' + s.reply);
      parts.push('');
    });
    return parts.join('\n');
  }
  function addMsg(role, text) { var m = el('div', 'msg ' + role, text); ccLog.appendChild(m); ccLog.scrollTop = ccLog.scrollHeight; return m; }
  function ask(q) {
    q = (q || '').trim(); if (!q || chatBusy) return;
    var code = ccCode.value.trim(); if (!code) { ccStatus('Enter the access code first'); return; }
    chat.push({ role: 'user', text: q }); addMsg('user', q); ccIn.value = '';
    var out = addMsg('ai', '…'), acc = '';
    chatBusy = true;
    fetch('/api/tutor', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessCode: code, model: MODEL, system: ccSystem(), messages: chat.slice(-12) }) })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || 'HTTP ' + r.status); });
        var rd = r.body.getReader(), dec = new TextDecoder();
        return (function pump() {
          return rd.read().then(function (x) {
            if (x.done) return;
            acc += dec.decode(x.value, { stream: true }); out.textContent = acc; ccLog.scrollTop = ccLog.scrollHeight;
            return pump();
          });
        })();
      })
      .then(function () { chat.push({ role: 'assistant', text: acc }); })
      .catch(function (e) { out.textContent = '[' + e.message + ']'; chat.pop(); })
      .then(function () { chatBusy = false; waitOff(); });   // reply done (or failed)
  }
  $('ccSend').addEventListener('click', function () { ask(ccIn.value); });
  ccIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ask(ccIn.value); } });
  (function chip() {
    var b = el('button', 'small', 'What am I working on?'); b.style.alignSelf = 'flex-start';
    b.addEventListener('click', function () { ask('What am I working on right now, and how far along does it look?'); });
    ccLog.appendChild(b);
  })();

  // ---------- ball game ----------
  var cv = $('cv'), g2 = cv.getContext('2d'), arena = $('arena');
  var W = 0, H = 0, DPR = 1;
  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: 20 };
  var trail = [];

  // canvas follows the game BOX (not the window)
  function resize() {
    DPR = window.devicePixelRatio || 1;
    var w = Math.max(1, arena.clientWidth), h = Math.max(1, arena.clientHeight);
    var oldW = W, oldH = H;
    W = w; H = h;
    cv.width = W * DPR; cv.height = H * DPR;
    if (!oldW) { ball.x = W / 2; ball.y = H * 0.45; }
    else { ball.x *= W / oldW; ball.y *= H / oldH; items.forEach(function (q) { q.x *= W / oldW; q.y *= H / oldH; }); }
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(arena);
  window.addEventListener('resize', resize);

  // input: keys only (stickVec stays 0; the frame loop still reads it)
  var stickVec = { x: 0, y: 0 }, keys = {};

  function resetInput() { keys = {}; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) resetInput(); });
  window.addEventListener('blur', resetInput);

  window.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test((e.target || {}).tagName)) return;   // typing in the chat / code boxes
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) sync(); return; }
    keys[e.code] = true;
    if (e.code.indexOf('Arrow') === 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  // expose for tests
  window.__blink = { stickVec: stickVec, ball: ball, items: function () { return items; }, score: function () { return score; }, getFlashes: function () { return flashes.length; } };


  // ---- items to collect (pattern from snake: keep a minimum on the field, bonus now and then) ----
  var items = [], pops = [], bits = [], score = 0, goldT = 6;
  var scoreEl = $('score');
  function showScore() { scoreEl.textContent = 'score ' + score + (best ? '  ·  best ' + best : ''); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function spawnItem(type) {
    var r = type === 'gold' ? 15 : 17, pad = r + 14, x, y, tries = 0;
    do { x = rnd(pad, W - pad); y = rnd(pad + 24, H - pad); tries++; }
    while (tries < 30 && Math.hypot(x - ball.x, y - ball.y) < 110);
    items.push({ type: type, x: x, y: y, r: r, born: nowS() });
  }
  function eatTone() {
    if (!clickOn || !ctx || ctx.state !== 'running') return;
    var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(780, t + 0.09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.12);
  }
  function collect(it) {
    var pts = it.type === 'gold' ? 50 : 10;
    score += pts; if (score > best) { best = score; save(); }
    showScore();
    pops.push({ x: it.x, y: it.y, t: 0, text: '+' + pts, color: it.type === 'gold' ? '#ffd24d' : '#c9a0ff' });
    for (var i = 0; i < 12; i++) { var a = rnd(0, 6.2832), v = rnd(60, 190); bits.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, c: it.type === 'gold' ? '#ffd24d' : '#a05fe0' }); }
    eatTone();
  }
  function updateItems(dt, now) {
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      if (it.type === 'gold' && now - it.born > 9) { items.splice(i, 1); continue; }   // bonus times out
      if (Math.hypot(it.x - ball.x, it.y - ball.y) < it.r + ball.r) { items.splice(i, 1); collect(it); }
    }
    var grapes = 0; for (var j = 0; j < items.length; j++) if (items[j].type === 'grape') grapes++;
    while (grapes < 2) { spawnItem('grape'); grapes++; }
    goldT -= dt;
    if (goldT <= 0) { if (!items.some(function (q) { return q.type === 'gold'; })) spawnItem('gold'); goldT = rnd(9, 16); }
    for (var k = pops.length - 1; k >= 0; k--) { pops[k].t += dt; pops[k].y -= 34 * dt; if (pops[k].t > 0.9) pops.splice(k, 1); }
    for (var m = bits.length - 1; m >= 0; m--) { var b = bits[m]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.94; b.vy *= 0.94; if (b.t > 0.5) bits.splice(m, 1); }
  }
  function drawGrape(x, y, r, pulse) {
    g2.save(); g2.translate(x, y); var sc = 1 + pulse * 0.25; g2.scale(sc, sc);
    g2.shadowColor = 'rgba(160,95,224,' + (0.35 + pulse * 0.5).toFixed(2) + ')'; g2.shadowBlur = 8 + pulse * 18;
    var u = r * 0.36, cells = [[-1, -1.1], [1, -1.1], [-2, 0], [0, 0], [2, 0], [-1, 1.1], [1, 1.1], [0, 2.2]];
    g2.fillStyle = '#7b3fc4';
    for (var i = 0; i < cells.length; i++) { g2.beginPath(); g2.arc(cells[i][0] * u, cells[i][1] * u, u * 1.12, 0, 6.2832); g2.fill(); }
    g2.shadowBlur = 0; g2.fillStyle = 'rgba(255,255,255,.35)';
    for (var j = 0; j < cells.length; j++) { g2.beginPath(); g2.arc(cells[j][0] * u - u * 0.35, cells[j][1] * u - u * 0.35, u * 0.28, 0, 6.2832); g2.fill(); }
    g2.strokeStyle = '#5fa04a'; g2.lineWidth = 2.5; g2.beginPath(); g2.moveTo(0, -2.2 * u); g2.lineTo(u * 0.8, -3.4 * u); g2.stroke();
    g2.restore();
  }
  function drawGold(x, y, r, pulse) {
    g2.save(); g2.shadowColor = 'rgba(255,210,77,' + (0.6 + pulse * 0.4).toFixed(2) + ')'; g2.shadowBlur = 14 + pulse * 20;
    g2.fillStyle = '#ffd24d'; g2.beginPath(); g2.arc(x, y, r * (1 + pulse * 0.2), 0, 6.2832); g2.fill();
    g2.shadowBlur = 0; g2.fillStyle = '#fff3b0'; g2.beginPath(); g2.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, 6.2832); g2.fill(); g2.restore();
  }

  var last = performance.now();
  function frame(t) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (t - last) / 1000); last = t;

    // flash level for dot + ball
    var now = nowS(); level = 0;
    while (flashes.length && flashes[0] < now - 0.4) flashes.shift();
    for (var i = 0; i < flashes.length; i++) {
      var age = now - flashes[i];
      if (age >= 0) level = Math.max(level, Math.max(0, 1 - age / 0.18));
    }
    dot.style.background = 'rgb(' + Math.round(58 + level * 197) + ',' + Math.round(18 + level * 41) + ',' + Math.round(16 + level * 32) + ')';
    dot.style.boxShadow = '0 0 ' + Math.round(level * 36) + 'px rgba(255,59,48,' + level.toFixed(2) + ')';

    // movement: arrow keys / WASD
    var ix = stickVec.x, iy = stickVec.y;
    if (keys.ArrowLeft || keys.KeyA) ix -= 1;
    if (keys.ArrowRight || keys.KeyD) ix += 1;
    if (keys.ArrowUp || keys.KeyW) iy -= 1;
    if (keys.ArrowDown || keys.KeyS) iy += 1;
    var m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; }
    var speed = Math.min(W, H) * 1.1;
    ball.vx += (ix * speed - ball.vx) * 8 * dt;      // ease toward the target velocity
    ball.vy += (iy * speed - ball.vy) * 8 * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    var r = ball.r;
    if (ball.x < r) { ball.x = r; ball.vx = 0; } else if (ball.x > W - r) { ball.x = W - r; ball.vx = 0; }
    if (ball.y < r) { ball.y = r; ball.vy = 0; } else if (ball.y > H - r) { ball.y = H - r; ball.vy = 0; }

    updateItems(dt, now);
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 28) trail.shift();

    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    g2.clearRect(0, 0, W, H);
    g2.strokeStyle = 'rgba(255,255,255,0.08)';
    g2.lineWidth = 3;
    g2.strokeRect(1.5, 1.5, W - 3, H - 3);          // arena border pulses with the beat
    for (var k = 0; k < trail.length; k++) {
      var a = k / trail.length;
      g2.fillStyle = 'rgba(201,168,76,' + (a * 0.25).toFixed(3) + ')';
      g2.beginPath(); g2.arc(trail[k].x, trail[k].y, ball.r * (0.4 + 0.6 * a), 0, 6.2832); g2.fill();
    }
    for (var q = 0; q < items.length; q++) {
      if (items[q].type === 'grape') drawGrape(items[q].x, items[q].y, items[q].r, 0);
      else drawGold(items[q].x, items[q].y, items[q].r, 0);
    }
    for (var u2 = 0; u2 < bits.length; u2++) { g2.globalAlpha = Math.max(0, 1 - bits[u2].t / 0.5); g2.fillStyle = bits[u2].c; g2.beginPath(); g2.arc(bits[u2].x, bits[u2].y, 3, 0, 6.2832); g2.fill(); }
    g2.globalAlpha = 1;
    g2.font = '700 15px -apple-system, sans-serif'; g2.textAlign = 'center';
    for (var p2 = 0; p2 < pops.length; p2++) { g2.globalAlpha = Math.max(0, 1 - pops[p2].t / 0.9); g2.fillStyle = pops[p2].color; g2.fillText(pops[p2].text, pops[p2].x, pops[p2].y); }
    g2.globalAlpha = 1;
    var rad = ball.r;
    g2.shadowColor = 'rgba(201,168,76,0.5)';
    g2.shadowBlur = 10;
    g2.fillStyle = '#c9a84c';
    g2.beginPath(); g2.arc(ball.x, ball.y, rad, 0, 6.2832); g2.fill();
    g2.shadowBlur = 0;
  }
  resize();
  showScore();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
