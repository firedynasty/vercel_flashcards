<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tally Logger</title>
<style>
  :root {
    --ink: #1c1b19;
    --paper: #f7f5f0;
    --line: #d8d3c8;
    --mark-a: #8a5a3b;
    --mark-a-dark: #6e4429;
    --mark-b: #3a5f8a;
    --mark-b-dark: #2d4a6e;
    --muted: #8a8578;
    --good: #3f6b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 28px);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    color: var(--ink);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px dashed var(--line);
  }
  .header h1 {
    margin: 0;
    font-size: 16px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .trackers {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .tracker {
    padding: 20px;
    border-bottom: 1px dashed var(--line);
  }
  .tracker-a { border-right: 1px dashed var(--line); }

  .tracker-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .tracker-display {
    font-weight: 700;
    line-height: 1;
    margin-bottom: 16px;
    min-height: 44px;
  }
  .tracker-a .tracker-display {
    font-size: 48px;
    color: var(--mark-a-dark);
  }
  .tracker-b .tracker-display {
    font-size: 14px;
    color: var(--mark-b-dark);
    line-height: 1.8;
    max-height: 160px;
    overflow-y: auto;
  }

  .tracker-btn-row {
    display: flex;
    gap: 8px;
  }
  button { font-family: inherit; cursor: pointer; border-radius: 6px; }
  .log-btn {
    flex: 1;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #fff8f0;
    border: none;
    transition: transform 0.05s ease, background 0.15s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tracker-a .log-btn { background: var(--mark-a); }
  .tracker-a .log-btn:hover { background: var(--mark-a-dark); }
  .tracker-b .log-btn { background: var(--mark-b); }
  .tracker-b .log-btn:hover { background: var(--mark-b-dark); }
  .log-btn:active { transform: scale(0.97); }

  .undo-btn {
    padding: 14px 12px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    border: 1px solid var(--line);
  }
  .undo-btn:hover { color: var(--ink); border-color: var(--ink); }

  .footer {
    border-top: 1px dashed var(--line);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .file-btn {
    background: transparent;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .file-btn:hover { border-color: var(--ink); }
  .file-btn.connected { color: var(--good); border-color: var(--good); }
  .status { display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  .status-text { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,27,25,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 100;
  }
  .dialog-overlay.show { opacity: 1; pointer-events: all; }
  .dialog {
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
    max-width: 320px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    transform: translateY(6px);
    transition: transform 0.15s ease;
  }
  .dialog-overlay.show .dialog { transform: translateY(0); }
  .dialog p {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  .dialog p strong { color: #b94040; }
  .dialog-btns {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .dialog-btns button { padding: 10px 18px; font-size: 13px; font-family: inherit; }
  .btn-cancel {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-cancel:hover { border-color: var(--ink); }
  .btn-delete {
    background: #b94040;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-delete:hover { background: #962f2f; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Tally Logger</h1>
  </div>

  <div class="trackers">
    <div class="tracker tracker-a">
      <div class="tracker-label">Tracker A — count</div>
      <div class="tracker-display" id="displayA">0</div>
      <div class="tracker-btn-row">
        <button class="log-btn" id="logBtnA">Log A</button>
        <button class="undo-btn" id="undoBtnA">Undo</button>
      </div>
    </div>
    <div class="tracker tracker-b">
      <div class="tracker-label">Tracker B — last hit</div>
      <div class="tracker-display" id="displayB">—</div>
      <div class="tracker-btn-row">
        <button class="log-btn" id="logBtnB">Log B</button>
        <button class="undo-btn" id="undoBtnB">Undo</button>
      </div>
      <input type="number" id="offsetB" placeholder="−hr (e.g. -2)" max="0"
        style="margin-top:8px;width:100%;padding:6px 8px;font-family:inherit;font-size:12px;
               border:1px solid var(--line);border-radius:6px;background:transparent;
               color:var(--ink);text-align:center;" />
    </div>
  </div>

  <div class="footer">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Loading…</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="file-btn" id="dbxBtn">Dropbox</button>
      <button class="file-btn" id="downloadBtn">Download .csv</button>
      <button class="file-btn" id="clearBtn">Clear</button>
    </div>
  </div>
</div>

<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <p>Delete <strong>all entries</strong> from localStorage and Dropbox?<br>This cannot be undone.</p>
    <div class="dialog-btns">
      <button class="btn-cancel" id="dialogCancel">Cancel</button>
      <button class="btn-delete" id="dialogConfirm">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const displayA    = document.getElementById('displayA');
  const displayB    = document.getElementById('displayB');
  const logBtnA     = document.getElementById('logBtnA');
  const logBtnB     = document.getElementById('logBtnB');
  const undoBtnA    = document.getElementById('undoBtnA');
  const undoBtnB    = document.getElementById('undoBtnB');
  const offsetB     = document.getElementById('offsetB');
  const dbxBtn        = document.getElementById('dbxBtn');
  const downloadBtn   = document.getElementById('downloadBtn');
  const clearBtn      = document.getElementById('clearBtn');
  const dialogOverlay = document.getElementById('dialogOverlay');
  const dialogCancel  = document.getElementById('dialogCancel');
  const dialogConfirm = document.getElementById('dialogConfirm');
  const statusDot     = document.getElementById('statusDot');
  const statusText    = document.getElementById('statusText');
  const toast         = document.getElementById('toast');

  // entries: { date, tracker_a, tracker_b }
  // One of tracker_a / tracker_b is set per row — the other is empty string.
  let entries = [];

  // ── Dropbox sync ──────────────────────────────────────────────────────────
  const DROPBOX_LOG_PATH = '/vercel/tally-log.json';
  const isLocalhost = ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
  let dropboxAccessToken = null;

  function generateCodeVerifier() {
    const array = new Uint8Array(64);
    crypto.getRandomValues(array);
    return btoa(String.fromCharCode(...array))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function generateCodeChallenge(verifier) {
    const data = new TextEncoder().encode(verifier);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function fetchDropboxAppKey() {
    if (isLocalhost) {
      let key = localStorage.getItem('dropbox-app-key') || '';
      if (!key) {
        key = prompt('Enter your Dropbox App Key (saved to localStorage for localhost):') || '';
        if (key) localStorage.setItem('dropbox-app-key', key);
      }
      return key;
    }
    try {
      const res = await fetch('/api/dropbox-key');
      const data = await res.json();
      return data.key || '';
    } catch { return ''; }
  }

  function setStatus(text, connected) {
    statusText.textContent = text;
    statusDot.classList.toggle('on', !!connected);
  }
  function updateDbxBtn() {
    if (dropboxAccessToken) {
      dbxBtn.textContent = '● Dropbox';
      dbxBtn.classList.add('connected');
      dbxBtn.title = 'Connected — click to sign out';
    } else {
      dbxBtn.textContent = 'Dropbox';
      dbxBtn.classList.remove('connected');
      dbxBtn.title = 'Sign in to Dropbox to sync across devices';
    }
  }

  async function dbxSignIn() {
    const appKey = await fetchDropboxAppKey();
    if (!appKey) { showToast('Dropbox App Key not configured'); return; }
    sessionStorage.setItem('tally_logger_pending', JSON.stringify({ entries }));
    const verifier = generateCodeVerifier();
    const challenge = await generateCodeChallenge(verifier);
    sessionStorage.setItem('dropbox_code_verifier', verifier);
    const redirectUri = window.location.origin + window.location.pathname;
    window.location.href = 'https://www.dropbox.com/oauth2/authorize?client_id=' + appKey +
      '&response_type=code&code_challenge=' + challenge +
      '&code_challenge_method=S256&redirect_uri=' + encodeURIComponent(redirectUri) +
      '&token_access_type=online';
  }

  async function dbxHandleOAuthRedirect() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (!code) return;
    const verifier = sessionStorage.getItem('dropbox_code_verifier');
    const appKey = await fetchDropboxAppKey();
    if (!verifier || !appKey) return;
    const redirectUri = window.location.origin + window.location.pathname;
    try {
      const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          code, grant_type: 'authorization_code', client_id: appKey,
          redirect_uri: redirectUri, code_verifier: verifier,
        }).toString(),
      });
      const data = await res.json();
      if (data.access_token) {
        dropboxAccessToken = data.access_token;
        sessionStorage.removeItem('dropbox_code_verifier');
      }
    } catch (err) { console.error('Dropbox auth error:', err); }
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  async function dbxSignOut() {
    if (dropboxAccessToken) {
      try {
        await fetch('https://api.dropboxapi.com/2/auth/token/revoke', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + dropboxAccessToken },
        });
      } catch { /* ignore */ }
    }
    dropboxAccessToken = null;
    updateDbxBtn();
    setStatus('Saved on this device — sign in to sync', false);
  }

  function dbxHandle401() {
    dropboxAccessToken = null;
    updateDbxBtn();
    setStatus('Dropbox session expired — sign in again', false);
  }

  async function dropboxDownloadFile(path) {
    if (!dropboxAccessToken) throw new Error('Not signed in');
    const response = await fetch('https://content.dropboxapi.com/2/files/download', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + dropboxAccessToken,
        'Dropbox-API-Arg': JSON.stringify({ path }),
      },
    });
    if (response.status === 401) { dbxHandle401(); throw new Error('Session expired'); }
    if (!response.ok) throw new Error('Download failed (' + response.status + ')');
    return await response.text();
  }

  async function dropboxUploadFile(path, content) {
    if (!dropboxAccessToken) throw new Error('Not signed in');
    const response = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + dropboxAccessToken,
        'Dropbox-API-Arg': JSON.stringify({ path, mode: { '.tag': 'overwrite' }, mute: true }),
        'Content-Type': 'application/octet-stream',
      },
      body: content,
    });
    if (response.status === 401) { dbxHandle401(); throw new Error('Session expired'); }
    if (!response.ok) throw new Error('Upload failed (' + response.status + ')');
    return true;
  }

  // ── Merge / save / load ───────────────────────────────────────────────────
  function entryKey(e) {
    return (e.date || '') + '|' + (e.tracker_a || '') + '|' + (e.tracker_b || '');
  }
  function mergeEntries(a, b) {
    const seen = new Set();
    const merged = [];
    a.concat(b).forEach(e => {
      if (!e || !e.date) return;
      const k = entryKey(e);
      if (seen.has(k)) return;
      seen.add(k);
      merged.push(e);
    });
    merged.sort((x, y) => {
      const tx = x.tracker_a || x.tracker_b || '';
      const ty = y.tracker_a || y.tracker_b || '';
      return (x.date + tx).localeCompare(y.date + ty);
    });
    return merged;
  }

  function saveLocal() {
    localStorage.setItem('tally_log_entries', JSON.stringify(entries));
  }

  async function loadLog() {
    if (dropboxAccessToken) {
      try {
        const data = JSON.parse(await dropboxDownloadFile(DROPBOX_LOG_PATH));
        if (Array.isArray(data)) entries = mergeEntries(entries, data);
        return 'Dropbox';
      } catch (e) { console.warn('Dropbox load failed:', e.message); }
    }
    try {
      const local = JSON.parse(localStorage.getItem('tally_log_entries') || '[]');
      if (Array.isArray(local)) entries = mergeEntries(entries, local);
    } catch (e) { /* ignore */ }
    return 'local';
  }

  async function saveLog({ mergeRemote }) {
    saveLocal();
    if (!dropboxAccessToken) return;
    try {
      if (mergeRemote) {
        let remote = [];
        try {
          const data = JSON.parse(await dropboxDownloadFile(DROPBOX_LOG_PATH));
          if (Array.isArray(data)) remote = data;
        } catch (e) { /* first upload */ }
        entries = mergeEntries(entries, remote);
        saveLocal();
      }
      await dropboxUploadFile(DROPBOX_LOG_PATH, JSON.stringify(entries, null, 2));
      setStatus('Dropbox · tally-log.json', true);
    } catch (e) {
      console.error('Dropbox save failed:', e);
      showToast('Dropbox save failed — kept on this device');
    }
  }

  // ── UI ────────────────────────────────────────────────────────────────────
  function todayStr() { return new Date().toLocaleDateString('en-CA'); }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function render() {
    const today = todayStr();
    const countA = entries.filter(e => e.date === today && e.tracker_a).length;
    const timesB = entries.filter(e => e.date === today && e.tracker_b).map(e => e.tracker_b);
    displayA.textContent = countA;
    displayB.innerHTML = timesB.length
      ? timesB.map(t => `<div>${t}</div>`).join('')
      : '<span style="color:var(--muted);font-style:italic;font-size:12px;">no hits yet</span>';
  }

  function toCSV() {
    const header = 'date,tracker_a,tracker_b\n';
    const rows = entries.map(e =>
      `${e.date},${e.tracker_a || ''},${e.tracker_b || ''}`
    ).join('\n');
    return header + rows + (entries.length ? '\n' : '');
  }

  let lastLogA = 0, lastLogB = 0;

  async function logEntry(tracker) {
    const now = Date.now();
    if (tracker === 'a') {
      if (now - lastLogA < 400) return;
      lastLogA = now;
    } else {
      if (now - lastLogB < 400) return;
      lastLogB = now;
    }
    let ts = now;
    if (tracker === 'b') {
      const hrs = parseInt(offsetB.value, 10);
      if (!isNaN(hrs) && hrs < 0) ts = now + hrs * 3600000;
      offsetB.value = '';
    }
    const time = new Date(ts).toTimeString().slice(0, 8);
    entries.push({
      date: todayStr(),
      tracker_a: tracker === 'a' ? time : '',
      tracker_b: tracker === 'b' ? time : '',
    });
    render();
    await saveLog({ mergeRemote: true });
    render();
  }

  async function undoEntry(tracker) {
    const hits = entries.map((e, i) => ({ e, i }))
      .filter(({ e }) => tracker === 'a' ? e.tracker_a : e.tracker_b);
    if (!hits.length) return;
    entries.splice(hits[hits.length - 1].i, 1);
    render();
    await saveLog({ mergeRemote: false });
  }

  function downloadCSV() {
    const blob = new Blob([toCSV()], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tally_log.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  logBtnA.addEventListener('click', () => logEntry('a'));
  logBtnB.addEventListener('click', () => logEntry('b'));
  undoBtnA.addEventListener('click', () => undoEntry('a'));
  undoBtnB.addEventListener('click', () => undoEntry('b'));
  dbxBtn.addEventListener('click', () => dropboxAccessToken ? dbxSignOut() : dbxSignIn());
  downloadBtn.addEventListener('click', downloadCSV);

  clearBtn.addEventListener('click', () => {
    dialogOverlay.classList.add('show');
    dialogConfirm.focus();
  });
  dialogCancel.addEventListener('click', () => dialogOverlay.classList.remove('show'));
  dialogOverlay.addEventListener('click', (e) => {
    if (e.target === dialogOverlay) dialogOverlay.classList.remove('show');
  });
  dialogConfirm.addEventListener('click', async () => {
    dialogOverlay.classList.remove('show');
    entries = [];
    localStorage.removeItem('tally_log_entries');
    render();
    if (dropboxAccessToken) {
      try {
        await dropboxUploadFile(DROPBOX_LOG_PATH, JSON.stringify([], null, 2));
        setStatus('Dropbox · tally-log.json', true);
        showToast('All entries deleted from Dropbox');
      } catch (e) {
        showToast('Local cleared — Dropbox delete failed');
      }
    } else {
      showToast('All entries cleared');
    }
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  (async function boot() {
    await dbxHandleOAuthRedirect();
    updateDbxBtn();

    let pending = null;
    try { pending = JSON.parse(sessionStorage.getItem('tally_logger_pending')); } catch (e) { /* ignore */ }
    sessionStorage.removeItem('tally_logger_pending');
    if (pending && Array.isArray(pending.entries)) entries = pending.entries;

    setStatus('Loading…', !!dropboxAccessToken);
    const source = await loadLog();
    render();
    setStatus(
      source === 'Dropbox' ? 'Dropbox · tally-log.json' : 'Saved on this device — sign in to sync',
      !!dropboxAccessToken
    );

    if (pending && pending.entries && pending.entries.length && dropboxAccessToken) {
      await saveLog({ mergeRemote: true });
      render();
      showToast('Log synced to Dropbox');
    }
  })();
})();
</script>

</body>
</html>
