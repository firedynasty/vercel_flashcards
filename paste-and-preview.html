<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paste & Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f3f4f6;
  color: #111;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: #1e1b4b;
  color: #fff;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#header .title {
  font-size: 13px;
  font-weight: 700;
  color: #c4b5fd;
  margin-right: 6px;
  white-space: nowrap;
}
.hbtn {
  height: 26px;
  font-size: 11px;
  font-weight: 700;
  padding: 0 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
}

/* ── Body: editor + divider + preview ───────────── */
#body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Editor pane ─────────────────────────────────── */
#editorPane {
  display: flex;
  flex-direction: column;
  width: 40%;
  min-width: 160px;
  background: #fff;
  border-right: 1px solid #ddd;
  overflow: hidden;
  flex-shrink: 0;
}

#editorBar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  background: #f0eeff;
  border-bottom: 1px solid #d8d5f5;
  font-size: 11px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#editorBar span.label {
  font-size: 11px;
  font-weight: 600;
  color: #5b21b6;
  flex-shrink: 0;
}

#editor {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  padding: 14px 16px;
  font-size: 14px;
  line-height: 1.65;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  background: #fff;
  color: #111;
  overflow-y: auto;
}

/* ── Divider ─────────────────────────────────────── */
#divider {
  width: 5px;
  background: #ddd;
  cursor: col-resize;
  flex-shrink: 0;
  transition: background 0.15s;
  z-index: 10;
}
#divider:hover, #divider.dragging { background: #7c3aed; }

/* ── Preview pane ────────────────────────────────── */
#previewPane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f9fafb;
  min-width: 200px;
}

#previewBar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: #e8f0fe;
  border-bottom: 1px solid #c5d8f6;
  font-size: 11px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#previewBar span.label {
  font-size: 11px;
  font-weight: 600;
  color: #1d4ed8;
  flex-shrink: 0;
}
#previewBar .spacer { flex: 1; }

#previewScroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
}

/* Blog content column */
#blogContent {
  margin: 0 auto;
  max-width: 720px;
  transition: max-width 0.2s;
}

/* MD render styles */
#blogContent.md-view {
  background: #fff;
  border-radius: 6px;
  padding: 28px 36px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  font-size: 16px;
  line-height: 1.75;
  color: #1a1a1a;
}
#blogContent.md-view h1 { font-size: 2em; margin: 0.8em 0 0.4em; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.3em; }
#blogContent.md-view h2 { font-size: 1.5em; margin: 1.2em 0 0.4em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
#blogContent.md-view h3 { font-size: 1.2em; margin: 1em 0 0.3em; }
#blogContent.md-view h4, #blogContent.md-view h5, #blogContent.md-view h6 { margin: 0.9em 0 0.3em; }
#blogContent.md-view p { margin: 0.7em 0; }
#blogContent.md-view ul, #blogContent.md-view ol { margin: 0.6em 0 0.6em 1.6em; }
#blogContent.md-view li { margin: 0.3em 0; }
#blogContent.md-view blockquote {
  border-left: 4px solid #7c3aed; background: #f5f3ff;
  padding: 10px 16px; margin: 1em 0; border-radius: 0 4px 4px 0;
  color: #4c1d95; font-style: italic;
}
#blogContent.md-view code {
  background: #f3f4f6; border-radius: 3px;
  padding: 2px 5px; font-size: 0.88em; color: #c026d3;
  font-family: 'SF Mono', 'Fira Code', monospace;
}
#blogContent.md-view pre {
  background: #1e1e2e; border-radius: 6px; padding: 14px 18px;
  overflow-x: auto; margin: 1em 0;
}
#blogContent.md-view pre code {
  background: transparent; color: #cdd6f4; font-size: 0.9em; padding: 0;
}
#blogContent.md-view a { color: #4f46e5; text-decoration: underline; }
#blogContent.md-view a:hover { color: #7c3aed; }
#blogContent.md-view hr { border: none; border-top: 2px solid #e5e7eb; margin: 1.5em 0; }
#blogContent.md-view table { border-collapse: collapse; width: 100%; margin: 1em 0; }
#blogContent.md-view th, #blogContent.md-view td { border: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; }
#blogContent.md-view th { background: #f3f4f6; font-weight: 600; }
#blogContent.md-view img { max-width: 100%; border-radius: 4px; }

/* Plain text view */
#blogContent.txt-view {
  background: #fff;
  border-radius: 6px;
  padding: 20px 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  color: #1a1a1a;
}

/* Empty state */
#emptyState {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60%;
  color: #9ca3af;
  text-align: center;
  pointer-events: none;
  user-select: none;
}
#emptyState .icon { font-size: 48px; margin-bottom: 12px; }
#emptyState p { font-size: 14px; line-height: 1.6; }

/* Width label */
#widthLabel {
  min-width: 50px;
  text-align: center;
  font-size: 11px;
  color: #6b7280;
}

/* ── Small buttons ───────────────────────────────── */
.sbtn {
  height: 22px;
  font-size: 11px;
  font-weight: 600;
  padding: 0 7px;
  border: 1px solid #d1d5db;
  border-radius: 4px;
  cursor: pointer;
  background: #fff;
  color: #374151;
  white-space: nowrap;
}
.sbtn:hover { background: #f3f4f6; }
.sbtn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

/* ── Dark mode ───────────────────────────────────── */
body.dark { background: #111; color: #e5e7eb; }
body.dark #header { background: #0d0c1d; }
body.dark #editorPane { background: #1a1a2e; border-right-color: #2d2d4e; }
body.dark #editorBar { background: #1e1b4b; border-bottom-color: #312e81; }
body.dark #editor { background: #1a1a2e; color: #e5e7eb; }
body.dark #divider { background: #333; }
body.dark #divider:hover, body.dark #divider.dragging { background: #7c3aed; }
body.dark #previewPane { background: #111827; }
body.dark #previewBar { background: #1e293b; border-bottom-color: #334155; }
body.dark #previewBar span.label { color: #93c5fd; }
body.dark #blogContent.md-view { background: #1e1e2e; color: #cdd6f4; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
body.dark #blogContent.md-view h1 { border-bottom-color: #313244; }
body.dark #blogContent.md-view h2 { border-bottom-color: #313244; }
body.dark #blogContent.md-view code { background: #313244; color: #f38ba8; }
body.dark #blogContent.md-view blockquote { background: #2d1b69; border-color: #7c3aed; color: #c4b5fd; }
body.dark #blogContent.md-view a { color: #a78bfa; }
body.dark #blogContent.md-view th { background: #313244; }
body.dark #blogContent.md-view th, body.dark #blogContent.md-view td { border-color: #313244; }
body.dark #blogContent.md-view hr { border-color: #313244; }
body.dark #blogContent.txt-view { background: #1e1e2e; color: #cdd6f4; }
body.dark .sbtn { background: #1f2937; border-color: #374151; color: #d1d5db; }
body.dark .sbtn:hover { background: #374151; }
body.dark .sbtn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
body.dark #widthLabel { color: #9ca3af; }
body.dark #hljs-theme { /* toggled via JS */ }
</style>
</head>
<body>

<!-- ══════════════════ HEADER ══════════════════ -->
<div id="header">
  <span class="title">Paste &amp; Preview</span>

  <button class="hbtn" onclick="sendToPreview()" style="background:#7c3aed;color:#fff;" title="Render editor text in preview pane (Ctrl+Enter)">
    &#9654; Render
  </button>
  <button class="hbtn" onclick="pasteAndRender()" style="background:#10b981;color:#fff;" title="Paste clipboard and render immediately">
    &#128203; Paste→P2
  </button>
  <button class="hbtn sbtn" onclick="pasteAppend()" style="background:#0ea5e9;color:#fff;border:none;" title="Paste clipboard and append to editor">&#128203; Paste→P1</button>

  <div style="flex:1"></div>

  <button class="hbtn sbtn" onclick="clearEditor()" title="Clear editor">Clear</button>
  <button class="hbtn sbtn" onclick="copyEditor()" title="Copy editor text">Copy</button>
  <button class="hbtn sbtn" id="darkBtn" onclick="toggleDark()">&#9789; Dark</button>
</div>

<!-- ══════════════════ BODY ══════════════════ -->
<div id="body">

  <!-- Editor pane -->
  <div id="editorPane">
    <div id="editorBar">
      <span class="label">Editor</span>
      <button class="sbtn" onclick="adjEditorFont(-1)" title="Smaller font">A−</button>
      <span id="editorFontLabel" style="min-width:22px;text-align:center;color:#6b7280;">14</span>
      <button class="sbtn" onclick="adjEditorFont(1)" title="Larger font">A+</button>
    </div>
    <textarea id="editor" placeholder="Paste or type markdown here...&#10;&#10;Press ▶ Render (or Ctrl+Enter) to display in the preview pane.&#10;&#10;# Heading&#10;**bold** *italic* `code`&#10;&#10;- bullet&#10;- list"></textarea>
  </div>

  <!-- Divider -->
  <div id="divider"></div>

  <!-- Preview pane -->
  <div id="previewPane">
    <div id="previewBar">
      <span class="label">Preview</span>
      <div class="spacer"></div>

      <!-- View toggle -->
      <button class="sbtn active" id="mdViewBtn" onclick="setView('md')" title="Render as markdown">MD</button>
      <button class="sbtn" id="txtViewBtn" onclick="setView('txt')" title="Show raw text">TXT</button>

      <!-- Content width -->
      <span style="margin-left:8px;font-size:11px;color:#6b7280;">Width:</span>
      <button class="sbtn" onclick="adjWidth(-80)" title="Narrower">◀</button>
      <span id="widthLabel">720px</span>
      <button class="sbtn" onclick="adjWidth(80)" title="Wider">▶</button>
      <button class="sbtn" onclick="resetWidth()" title="Reset width">auto</button>

      <!-- Preview font -->
      <span style="margin-left:8px;font-size:11px;color:#6b7280;">Font:</span>
      <button class="sbtn" onclick="adjPreviewFont(-1)">A−</button>
      <span id="previewFontLabel" style="min-width:22px;text-align:center;color:#6b7280;">16</span>
      <button class="sbtn" onclick="adjPreviewFont(1)">A+</button>
    </div>

    <div id="previewScroll">
      <div id="emptyState">
        <div class="icon">&#128196;</div>
        <p>Paste or type markdown in the editor<br>then press <strong>&#9654; Render</strong> or <kbd>Ctrl+Enter</kbd></p>
      </div>
      <div id="blogContent" class="md-view" style="display:none;"></div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
var viewMode = 'md';       // 'md' | 'txt'
var blogWidth = 720;       // px, 0 = no limit
var blogWidthAuto = false; // true = max-width: none
var editorFontSize = 14;
var previewFontSize = 16;
var isDark = false;

// Persist
function load(k, def) { try { var v = localStorage.getItem(k); return v !== null ? v : def; } catch(e) { return def; } }
function save(k, v)   { try { localStorage.setItem(k, v); } catch(e) {} }

// Init persisted values
editorFontSize   = parseFloat(load('ppv-editor-font', 14));
previewFontSize  = parseFloat(load('ppv-preview-font', 16));
blogWidth        = parseFloat(load('ppv-blog-width', 720));
blogWidthAuto    = load('ppv-blog-auto', 'false') === 'true';
viewMode         = load('ppv-view', 'md');
isDark           = load('ppv-dark', 'false') === 'true';

// ══════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', function() {
  // Restore editor content
  var saved = load('ppv-editor-text', '');
  if (saved) document.getElementById('editor').value = saved;

  // Apply initial styles
  applyEditorFont();
  applyPreviewFont();
  applyWidth();
  applyViewButtons();
  if (isDark) applyDark(true);

  // Re-render if there was saved content
  if (saved) renderPreview();

  // Ctrl+Enter to render
  document.getElementById('editor').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendToPreview();
    }
  });

  // Save editor text on input
  document.getElementById('editor').addEventListener('input', function() {
    save('ppv-editor-text', this.value);
  });

  // Divider drag
  initDivider();
});

// ══════════════════════════════════════════════
// Render
// ══════════════════════════════════════════════
function renderPreview() {
  var text = document.getElementById('editor').value;
  var empty = document.getElementById('emptyState');
  var blog  = document.getElementById('blogContent');

  if (!text.trim()) {
    empty.style.display = 'flex';
    blog.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  blog.style.display = 'block';

  if (viewMode === 'md') {
    blog.className = 'md-view';
    marked.setOptions({ breaks: true, gfm: true });
    blog.innerHTML = marked.parse(text);
    blog.querySelectorAll('pre code').forEach(function(b) { hljs.highlightElement(b); });
  } else {
    blog.className = 'txt-view';
    blog.textContent = text;
  }

  applyWidth();
  applyPreviewFont();

  // Flash live indicator
}

function sendToPreview() {
  renderPreview();
  // Scroll preview to top
  document.getElementById('previewScroll').scrollTop = 0;
  // Clear the editor after rendering
  var ed = document.getElementById('editor');
  ed.value = '';
  save('ppv-editor-text', '');
}

function pasteAndRender() {
  navigator.clipboard.readText().then(function(txt) {
    if (!txt) { alert('Clipboard is empty.'); return; }
    document.getElementById('editor').value = txt;
    save('ppv-editor-text', txt);
    sendToPreview();
  }).catch(function() {
    alert('Clipboard access denied.');
  });
}

// ══════════════════════════════════════════════
// View toggle (MD / TXT)
// ══════════════════════════════════════════════
function setView(mode) {
  viewMode = mode;
  save('ppv-view', mode);
  applyViewButtons();
  renderPreview();
}

function applyViewButtons() {
  document.getElementById('mdViewBtn').classList.toggle('active', viewMode === 'md');
  document.getElementById('txtViewBtn').classList.toggle('active', viewMode === 'txt');
}

// ══════════════════════════════════════════════
// Paste append to editor (pane 1)
// ══════════════════════════════════════════════
function pasteAppend() {
  navigator.clipboard.readText().then(function(txt) {
    if (!txt) { alert('Clipboard is empty.'); return; }
    var ed = document.getElementById('editor');
    ed.value = ed.value ? ed.value + '\n\n' + txt : txt;
    save('ppv-editor-text', ed.value);
    ed.scrollTop = ed.scrollHeight;
    ed.focus();
  }).catch(function() {
    alert('Clipboard access denied.');
  });
}

// ══════════════════════════════════════════════
// Blog width
// ══════════════════════════════════════════════
function adjWidth(delta) {
  blogWidthAuto = false;
  blogWidth = Math.max(280, Math.min(2000, blogWidth + delta));
  save('ppv-blog-width', blogWidth);
  save('ppv-blog-auto', 'false');
  applyWidth();
}

function resetWidth() {
  blogWidthAuto = true;
  save('ppv-blog-auto', 'true');
  applyWidth();
}

function applyWidth() {
  var blog = document.getElementById('blogContent');
  var label = document.getElementById('widthLabel');
  if (blogWidthAuto) {
    blog.style.maxWidth = '';
    label.textContent = 'auto';
  } else {
    blog.style.maxWidth = blogWidth + 'px';
    label.textContent = blogWidth + 'px';
  }
}

// ══════════════════════════════════════════════
// Font sizes
// ══════════════════════════════════════════════
function adjEditorFont(d) {
  editorFontSize = Math.max(10, Math.min(32, editorFontSize + d));
  save('ppv-editor-font', editorFontSize);
  applyEditorFont();
}
function applyEditorFont() {
  document.getElementById('editor').style.fontSize = editorFontSize + 'px';
  document.getElementById('editorFontLabel').textContent = editorFontSize;
}

function adjPreviewFont(d) {
  previewFontSize = Math.max(10, Math.min(32, previewFontSize + d));
  save('ppv-preview-font', previewFontSize);
  applyPreviewFont();
}
function applyPreviewFont() {
  var blog = document.getElementById('blogContent');
  blog.style.fontSize = previewFontSize + 'px';
  document.getElementById('previewFontLabel').textContent = previewFontSize;
}

// ══════════════════════════════════════════════
// Editor utils
// ══════════════════════════════════════════════
function clearEditor() {
  if (!confirm('Clear the editor?')) return;
  document.getElementById('editor').value = '';
  save('ppv-editor-text', '');
  renderPreview();
}

function copyEditor() {
  var txt = document.getElementById('editor').value;
  navigator.clipboard.writeText(txt).then(function() {
    var btn = event.target;
    var orig = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(function() { btn.textContent = orig; }, 1200);
  }).catch(function() {});
}

// ══════════════════════════════════════════════
// Dark mode
// ══════════════════════════════════════════════
function toggleDark() {
  isDark = !isDark;
  save('ppv-dark', isDark);
  applyDark(isDark);
}

function applyDark(dark) {
  document.body.classList.toggle('dark', dark);
  // Swap highlight.js theme
  var link = document.getElementById('hljs-theme');
  link.href = dark
    ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
    : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
}

// ══════════════════════════════════════════════
// Divider drag
// ══════════════════════════════════════════════
function initDivider() {
  var divider    = document.getElementById('divider');
  var editorPane = document.getElementById('editorPane');
  var bodyEl     = document.getElementById('body');
  var dragging   = false;
  var startX, startW;

  divider.addEventListener('mousedown', function(e) {
    dragging = true;
    startX   = e.clientX;
    startW   = editorPane.offsetWidth;
    divider.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  });

  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = e.clientX - startX;
    var newW  = Math.max(160, Math.min(bodyEl.offsetWidth - 200, startW + delta));
    editorPane.style.width = newW + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });
}
</script>
</body>
</html>
