<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama Rehearsal</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --muted:#aaa; --dim:#888; --ctl:#1c1c1c; --line:#444; --line2:#333; --accent:#4da3ff;
          --me:#1d3b66; --them:#2b2236; --note:#9a8fb0; --ok:#4cc38a; --bad:#ff7a7a; --hint:#3a3210; --hintfg:#f3d77a; --err:#5a1f1f; }
  :root[data-theme="light"] { color-scheme: light; --bg:#f6f6f4; --fg:#1a1a1a; --muted:#555; --dim:#777; --ctl:#fff; --line:#c8c8c4; --line2:#ddd;
          --accent:#1a73e8; --me:#d6e6ff; --them:#eadff5; --note:#7a6f92; --ok:#14804a; --bad:#c62828; --hint:#fff3c4; --hintfg:#6b5200; --err:#ffd9d9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
  .bar input:not([type=checkbox]), select, button, textarea { background: var(--ctl); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  select option { background: var(--ctl); color: var(--fg); }
  .bar input:not([type=checkbox]) { width: 130px; }
  button { cursor: pointer; min-height: 38px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #2a6fd6; border-color: #2a6fd6; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  label { font-size: 12px; color: var(--muted); }
  .status { font-size: 12px; color: var(--dim); margin-left: auto; }
  details.editor { border-bottom: 1px solid var(--line2); padding: 6px 12px; font-size: 13px; color: var(--muted); }
  details.editor textarea { width: 100%; min-height: 200px; margin-top: 8px; font: 13px/1.5 ui-monospace, monospace; resize: vertical; }
  .scene { padding: 10px 14px; border-bottom: 1px solid var(--line2); font-size: 13px; color: var(--muted); line-height: 1.5; }
  .scene b { color: var(--fg); }
  .log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 90%; padding: 10px 14px; border-radius: 12px; font-size: 16px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg.them { align-self: flex-start; background: var(--them); }
  .msg .who { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .msg .note { display: block; font-size: 12px; font-style: italic; color: var(--note); margin-top: 4px; }
  .msg.sys { align-self: center; background: transparent; color: var(--dim); font-size: 13px; text-align: center; }
  .msg.err { background: var(--err); align-self: center; }
  .hintbox { margin: 0 12px 8px; padding: 10px 14px; border-radius: 10px; background: var(--hint); color: var(--hintfg); font-size: 16px; line-height: 1.5; display: none; white-space: pre-wrap; }
  .cue { margin: 0 12px; font-size: 12px; color: var(--dim); min-height: 16px; }
  .input { display: flex; gap: 8px; padding: 8px 12px 12px; align-items: flex-end; flex-wrap: wrap; }
  .input textarea { flex: 1 1 240px; min-height: 52px; max-height: 160px; font-size: 16px; resize: none; font-family: inherit; }
  .input .btns { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="bar">
  <label>I play <select id="role"></select></label>
  <button class="primary" id="startBtn">Start scene</button>
  <button id="promptBtn" title="Copy a prompt that makes Claude/ChatGPT write a scene in this page's format">Prompt</button>
  <label>Model <input id="model" list="models" value="gpt-4o-mini" spellcheck="false"></label>
  <datalist id="models"><option value="gpt-4.1-mini"><option value="gpt-4.1"><option value="gpt-4o-mini"><option value="gpt-4o"><option value="gpt-5-mini"><option value="gpt-5"></datalist>
  <label>Access code <input id="code" type="password" autocomplete="off"></label>
  <button id="gBtn" title="Sign in to load a script from a Google Doc">Google</button>
  <input id="folder" type="text" placeholder="Drive folder link (blank = recent docs)" spellcheck="false" autocomplete="off" style="width:230px">
  <select id="recent" disabled><option value="">Script from Google Doc…</option></select>
  <button id="themeBtn" title="Light / dark">☀︎</button>
  <span class="status" id="status"></span>
</div>

<details class="editor"><summary>Edit scene script</summary>
  <textarea id="script" spellcheck="false"></textarea>
  <div style="margin-top:8px"><button id="loadBtn">Use this script</button> <button id="resetBtn">Restore example</button></div>
  <div style="margin-top:6px">Format: <code>SCENE:</code>, <code>CHARACTERS:</code>, <code>GOAL:</code> headers, then <code>NAME: line (stage direction)</code>. Text in (parentheses) is shown as a stage direction.</div>
</details>

<div class="scene" id="scene"></div>
<div class="log" id="log"></div>
<div class="hintbox" id="hintbox"></div>
<div class="cue" id="cue"></div>
<div class="input">
  <textarea id="entry" placeholder="Start the scene, then say your line…" disabled></textarea>
  <div class="btns">
    <button class="primary" id="sendBtn" disabled>Say it</button>
    <button id="hintBtn" disabled>Stuck? Hint</button>
    <button id="copyBtn">Copy for review</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const DEFAULT_SCRIPT = `SCENE: Capulet's orchard, night. Juliet appears at her balcony, unaware that Romeo is hiding below.
CHARACTERS: ROMEO, JULIET
GOAL (improv mode): Romeo wants to be sure Juliet loves him back. Juliet wants to be sure he's serious, and safe.

ROMEO: But soft, what light through yonder window breaks? It is the east, and Juliet is the sun. (He speaks to himself, awestruck, not yet to her.)
JULIET: Ay me! (She sighs, thinking she's alone.)
ROMEO: She speaks. O, speak again, bright angel!
JULIET: O Romeo, Romeo, wherefore art thou Romeo? Deny thy father and refuse thy name. (Wherefore means "why", not "where". She's asking why he has to be a Montague.)
ROMEO: Shall I hear more, or shall I speak at this? (An aside. He can't decide whether to stay hidden.)
JULIET: 'Tis but thy name that is my enemy. What's in a name? That which we call a rose by any other word would smell as sweet.
ROMEO: I take thee at thy word. Call me but love, and I'll be new baptized. Henceforth I never will be Romeo. (He steps out of the shadows.)
JULIET: What man art thou that, thus bescreened in night, so stumblest on my counsel? (She's startled and afraid.)
ROMEO: By a name I know not how to tell thee who I am. My name, dear saint, is hateful to myself because it is an enemy to thee.
JULIET: My ears have yet not drunk a hundred words of that tongue's utterance, yet I know the sound. Art thou not Romeo, and a Montague?
ROMEO: Neither, fair maid, if either thee dislike.
JULIET: How camest thou hither, tell me, and wherefore? The orchard walls are high and hard to climb, and the place death, considering who thou art, if any of my kinsmen find thee here. (Her worry is for his life, not her own.)
ROMEO: With love's light wings did I o'erperch these walls, for stony limits cannot hold love out.
JULIET: If they do see thee, they will murder thee.
ROMEO: Alack, there lies more peril in thine eye than twenty of their swords. Look thou but sweet, and I am proof against their enmity.
JULIET: I would not for the world they saw thee here.
ROMEO: I have night's cloak to hide me from their eyes. And but thou love me, let them find me here. My life were better ended by their hate than death prorogued, wanting of thy love.
JULIET: Thou know'st the mask of night is on my face, else would a maiden blush bepaint my cheek for that which thou hast heard me speak tonight.
JULIET: Fain would I dwell on form, fain, fain deny what I have spoke. But farewell compliment! Dost thou love me? (She's admitting she said too much.)
ROMEO: Lady, by yonder blessed moon I swear that tips with silver all these fruit-tree tops.
JULIET: O, swear not by the moon, th' inconstant moon, that monthly changes in her circled orb, lest that thy love prove likewise variable. (She tests him: don't promise on something that changes.)
ROMEO: What shall I swear by?
JULIET: Do not swear at all; or if thou wilt, swear by thy gracious self, which is the god of my idolatry, and I'll believe thee.
ROMEO: If my heart's dear love
JULIET: Well, do not swear. Although I joy in thee, I have no joy of this contract tonight. It is too rash, too unadvised, too sudden, too like the lightning, which doth cease to be ere one can say "It lightens." (She loves him but fears they are moving too fast.)
JULIET: Sweet, good night. This bud of love, by summer's ripening breath, may prove a beauteous flower when next we meet.
ROMEO: O, wilt thou leave me so unsatisfied?
JULIET: What satisfaction canst thou have tonight?
ROMEO: The exchange of thy love's faithful vow for mine.
JULIET: I gave thee mine before thou didst request it. (Her honesty undercuts her caution.)
JULIET: Good night, good night! Parting is such sweet sorrow that I shall say good night till it be morrow.
ROMEO: Sleep dwell upon thine eyes, peace in thy breast. Would I were sleep and peace, so sweet to rest!`;

// ── Light / dark (shares the tutor page's setting) ──
function applyTheme(t) { document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'light' ? '☾' : '☀︎'; ls.set('tutor-theme', t); }
applyTheme(ls.get('tutor-theme', 'dark'));
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// ── Script parsing ──
function parseScript(text) {
  const out = { scene: '', goal: '', characters: [], lines: [] };
  let last = null;
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.trim(); if (!l) continue;
    let m;
    if ((m = l.match(/^SCENE\s*:\s*(.*)$/i))) { out.scene = m[1]; last = null; continue; }
    if ((m = l.match(/^CHARACTERS?\s*:\s*(.*)$/i))) { out.characters = m[1].split(',').map(s => s.trim().toUpperCase()).filter(Boolean); last = null; continue; }
    if ((m = l.match(/^GOALS?[^:]*:\s*(.*)$/i))) { out.goal = m[1]; last = null; continue; }
    if ((m = l.match(/^([A-Z][A-Z0-9 .'-]{0,30}):\s*(.*)$/))) { last = { who: m[1].trim(), raw: m[2] }; out.lines.push(last); continue; }
    if (last) last.raw += ' ' + l; // continuation of the previous speech
  }
  for (const ln of out.lines) {
    const notes = [...ln.raw.matchAll(/\(([^)]*)\)/g)].map(x => x[1].trim());
    ln.text = ln.raw.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
    ln.note = notes.join(' ');
  }
  out.lines = out.lines.filter(l => l.text);
  if (!out.characters.length) out.characters = [...new Set(out.lines.map(l => l.who))];
  return out;
}

// ── State ──
let sc = parseScript(DEFAULT_SCRIPT);
let st = null; // { role, partner, stats, messages, transcript, busy, pendingHint }
const log = $('log');

function setStatus(t) { $('status').textContent = t || ''; }
function scrollLog() { log.scrollTop = log.scrollHeight; }
function bubble(cls, who, text, note) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (who) { const w = document.createElement('span'); w.className = 'who'; w.textContent = who; d.appendChild(w); }
  const t = document.createElement('span'); t.textContent = text; d.appendChild(t);
  if (note) { const n = document.createElement('span'); n.className = 'note'; n.textContent = '(' + note + ')'; d.appendChild(n); }
  log.appendChild(d); scrollLog(); return t;
}
function setEnabled(on) { for (const id of ['entry', 'sendBtn', 'hintBtn']) $(id).disabled = !on; if (on) $('entry').focus(); }
function hideHint() { $('hintbox').style.display = 'none'; $('hintbox').textContent = ''; }

function loadScene() {
  const roles = sc.characters;
  const prev = ls.get('drama-role', '');
  $('role').innerHTML = '';
  for (const c of roles) { const o = document.createElement('option'); o.value = c; o.textContent = c[0] + c.slice(1).toLowerCase(); $('role').appendChild(o); }
  if (roles.includes(prev)) $('role').value = prev;
  $('scene').innerHTML = '';
  const s = document.createElement('div'); s.innerHTML = '<b>Scene:</b> '; s.appendChild(document.createTextNode(sc.scene || '(none)')); $('scene').appendChild(s);
  if (sc.goal) { const g = document.createElement('div'); g.innerHTML = '<b>Goal:</b> '; g.appendChild(document.createTextNode(sc.goal)); $('scene').appendChild(g); }
}

$('script').value = ls.get('drama-script', DEFAULT_SCRIPT);
$('loadBtn').onclick = () => {
  const p = parseScript($('script').value);
  if (p.lines.length < 2 || p.characters.length < 2) { setStatus('Need at least two characters with lines (NAME: line)'); return; }
  sc = p; ls.set('drama-script', $('script').value); loadScene(); resetStage(); setStatus('Script loaded: ' + sc.lines.length + ' lines');
};
$('resetBtn').onclick = () => { $('script').value = DEFAULT_SCRIPT; ls.set('drama-script', DEFAULT_SCRIPT); $('loadBtn').click(); };
$('role').onchange = () => ls.set('drama-role', $('role').value);
$('model').value = ls.get('drama-model', 'gpt-4o-mini'); $('model').onchange = () => ls.set('drama-model', $('model').value.trim());
$('code').value = ls.get('ocr-access-code', ''); $('code').onchange = () => ls.set('ocr-access-code', $('code').value.trim());

function resetStage() { st = null; log.innerHTML = ''; hideHint(); $('cue').textContent = ''; $('entry').value = ''; setEnabled(false); $('entry').placeholder = 'Start the scene, then say your line…'; }

// ── Start ──
$('startBtn').onclick = () => {
  resetStage();
  const role = $('role').value;
  const partner = sc.characters.find(c => c !== role) || sc.characters[0];
  st = { role, partner, stats: { hints: 0 }, messages: [], busy: false, transcript: [] };
  bubble('sys', '', 'You are ' + role + '. The AI plays ' + partner + '. Improvise with the scene goal in mind. Type "hint" or tap Hint if you get stuck.');
  startImprov();
};

// ── Improv (AI plays the other role) ──
function improvSystem() {
  const script = sc.lines.map(l => l.who + ': ' + l.text).join('\n');
  return 'You are ' + st.partner + ' in a live scene rehearsal with a human actor who plays ' + st.role + '.\n' +
    'Scene: ' + sc.scene + '\nGoal (play your own side): ' + sc.goal + '\n' +
    'Stay strictly in character. Reply with only ' + st.partner + '\'s spoken words: 1–3 sentences, optionally a stage direction in parentheses of at most 4 words, with no character name in it (e.g. "(softly)" or "(steps closer)"), and often none at all. Vary your turns: do not end every reply with a question. Mix statements, reactions, teasing, doubt, or warmth with an occasional question, and let the scene move forward through its story beats. Match the register and period language of the script. If a message ends with a bracketed [Director note: …], it is out-of-character information that the actor needed a prompt for that line; never mention or quote it, but you may let ' + st.partner + ' react naturally to a moment of hesitation. Never mention being an AI or break the fourth wall. React to what the human actually says; if they stumble or go off-script, adapt naturally and steer back toward the story beats.\n' +
    'Reference script (tone and story beats; follow loosely, not word for word):\n' + script;
}
async function ask(messages, onDelta) {
  if (!$('code').value.trim()) throw new Error('Enter the access code');
  const r = await fetch('/api/tutor', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ accessCode: $('code').value.trim(), model: $('model').value.trim(), system: improvSystem(), messages }) });
  if (r.status === 401) { ls.set('ocr-access-code', ''); $('code').value = ''; }
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'HTTP ' + r.status); }
  const reader = r.body.getReader(), dec = new TextDecoder(); let acc = '';
  while (true) { const { done, value } = await reader.read(); if (done) break; acc += dec.decode(value, { stream: true }); if (onDelta) onDelta(acc); }
  return acc.trim();
}
async function partnerSpeaks(userText) {
  st.busy = true; setEnabled(false);
  const msgs = st.messages.concat([{ role: 'user', text: userText }]);
  const out = bubble('them', st.partner, '…');
  try {
    const reply = await ask(msgs, t => { out.textContent = t; scrollLog(); });
    st.messages = msgs.concat([{ role: 'assistant', text: reply }]); tr(st.partner, reply);
  } catch (e) { out.parentElement.remove(); bubble('err', '', 'Error: ' + e.message); }
  st.busy = false; hideHint(); $('entry').placeholder = 'Your line (improvise)…'; setEnabled(true);
}
function startImprov() {
  $('cue').textContent = 'Improv: say anything in character as ' + st.role + '.';
  if (sc.lines[0] && sc.lines[0].who === st.partner) partnerSpeaks('(The scene begins. Speak your opening line.)');
  else { $('entry').placeholder = 'Your opening line…'; setEnabled(true); }
}
function submitImprov() {
  const said = $('entry').value.trim(); if (!said || st.busy) return;
  const hint = st.pendingHint; st.pendingHint = null;
  bubble('me', st.role + (hint ? ' · 💡 hint used' : ''), said, hint ? 'hint: ' + hint : '');
  tr(st.role, said, hint ? 'hint used; suggested line: "' + hint + '"' : ''); $('entry').value = '';
  partnerSpeaks(hint ? said + '\n[Director note: the actor used a hint for this line. Suggested line was: "' + hint + '"]' : said);
}

async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); setStatus(okMsg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); setStatus(ok ? okMsg : 'Copy failed — clipboard is blocked in this browser');
  }
}
const SCENE_PROMPT = `Write a two-person scene I can rehearse and memorize. Output ONLY the scene in
exactly this plain-text format (no markdown, no commentary before or after):

SCENE: <one sentence: setting, time, and what just happened>
CHARACTERS: <NAME1>, <NAME2>
GOAL (improv mode): <NAME1> wants ...  <NAME2> wants ...

NAME1: spoken line (short stage direction in parentheses, optional)
NAME2: spoken line
...

Rules:
- Character names in ALL CAPS, one word each, followed by a colon. Nothing else
  on the page may start with an ALL-CAPS word and a colon (no "NOTE:", no "ACT I:").
- One speaker per line. Alternate speakers mostly, but a character may speak twice in a row.
- 20–30 lines. Each line 1–3 sentences, short enough to memorize.
- Put stage directions or translations in (parentheses) at the end of the line.
  Everything in parentheses is a stage direction and is not spoken, so keep spoken words outside them.
- The goals must pull against each other so the scene works as improv too.`;
$('promptBtn').onclick = () => copyText(SCENE_PROMPT, 'Copied scene-writing prompt — paste it into Claude chat and add your topic');

// ── Copy for review (prompt + transcript → clipboard) ──
function tr(who, text, tag) { if (st) st.transcript.push({ who, text, tag: tag || '' }); }
const REVIEW_PROMPT = `Below is a transcript of me rehearsing a scene against an AI partner. Lines
marked "hint used" are where I got stuck. Please:
1. Say what I did well, in two lines.
2. List the 3 places I was weakest (include the hinted lines) and why.
3. Give me a "what I could have said" rewrite for each weak line.
4. Write a NEW harder scene in the exact /drama format (SCENE:, CHARACTERS:,
   GOAL (improv mode):, then NAME: line lines) that practises those weak spots.
   Same two characters or a new pair, your choice.`;
$('copyBtn').onclick = () => {
  if (!st || !st.transcript.length) { setStatus('Nothing to copy yet — start the scene first'); return; }
  const head = 'Scene: ' + sc.scene + (sc.goal ? '\nGoal: ' + sc.goal : '') + '\nI played ' + st.role + '; the AI played ' + st.partner + ' (improv).\n';
  const body = st.transcript.map(t => t.who + (t.tag ? ' [' + t.tag + ']' : '') + ': ' + t.text).join('\n');
  const original = '\n\nFor comparison, here is the ORIGINAL scripted scene (the improv above was free, so note where I drifted from these story beats):\n' + sc.lines.map(l => l.who + ': ' + l.text).join('\n');
  const out = REVIEW_PROMPT + '\n\n' + head + '\n' + body + original;
  copyText(out, 'Copied review prompt + transcript (' + st.transcript.length + ' lines)');
};

// ── Shared handlers ──
$('sendBtn').onclick = () => {
  if (!st) return;
  if (/^(hint|\?)$/i.test($('entry').value.trim())) { $('entry').value = ''; $('hintBtn').click(); return; } // typing "hint" or "?" = Hint button
  submitImprov();
};
$('entry').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('sendBtn').click(); } });
$('hintBtn').onclick = async () => {
  if (!st) return;
  const hb = $('hintbox'); hb.style.display = 'block';
  if (!st.busy) {
    hb.textContent = 'Thinking of a line…'; st.busy = true; $('hintBtn').disabled = true;
    try {
      const q = '(Director, out of character: I am stuck as ' + st.role + '. Suggest one short line I could say next, in character. Output only the line.)';
      const h = await ask(st.messages.concat([{ role: 'user', text: q }]));
      hb.textContent = 'Try: ' + h; st.pendingHint = h; st.stats.hints++;
      bubble('sys', '', '💡 Hint used: ' + h);
    } catch (e) { hb.textContent = 'Hint failed: ' + e.message; }
    st.busy = false; $('hintBtn').disabled = false;
  }
};

// ── Load a script from a recent Google Doc (read-only) ──
const GDRIVE_CLIENT_ID = '1095683227908-7ro25k16mprkf408i3lf583gti8v759b.apps.googleusercontent.com'; // same client as googlenotes.html / tutor.html
let gToken = null, gClient = null;
const gAuth = () => ({ Authorization: 'Bearer ' + gToken });
function gInit() {
  if (!(window.google && google.accounts)) { setTimeout(gInit, 150); return; }
  gClient = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.readonly',
    callback: resp => {
      if (!resp.access_token) { setStatus('Google sign-in failed: ' + (resp.error || 'unknown')); return; }
      gToken = resp.access_token; $('gBtn').textContent = '● Google'; $('gBtn').style.color = '#4da3ff'; $('recent').disabled = false;
      setStatus('Google signed in'); loadRecent();
    }
  });
}
function gExpired() { gToken = null; $('gBtn').textContent = 'Google'; $('gBtn').style.color = ''; $('recent').disabled = true; return new Error('Google session expired — sign in again'); }
$('gBtn').onclick = () => { if (gToken) { google.accounts.oauth2.revoke(gToken); gExpired(); setStatus('Google signed out'); } else if (gClient) gClient.requestAccessToken(); };
// Folder link / URL / bare ID -> folder ID (blank = recent docs)
function folderId(v) {
  v = (v || '').trim(); if (!v) return '';
  const m = v.match(/\/folders\/([\w-]+)/) || v.match(/[?&]id=([\w-]+)/) || v.match(/^([\w-]{20,})$/);
  return m ? m[1] : null;
}
async function loadRecent() {
  const raw = $('folder').value, fid = folderId(raw);
  if (fid === null) { setStatus('Could not find a folder ID in that link'); return; }
  try {
    const base = "mimeType='application/vnd.google-apps.document' and trashed=false";
    const q = encodeURIComponent(fid ? "'" + fid + "' in parents and " + base : base);
    const order = fid ? 'modifiedTime+desc&pageSize=100' : 'viewedByMeTime+desc&pageSize=15';
    const r = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=' + order + '&supportsAllDrives=true&includeItemsFromAllDrives=true&fields=files(id,name)', { headers: gAuth() });
    if (r.status === 401) throw gExpired();
    if (!r.ok) throw new Error('Could not list ' + (fid ? 'folder' : 'recent docs') + ' (HTTP ' + r.status + ')');
    const d = await r.json(); const sel = $('recent');
    sel.innerHTML = '<option value="">' + (fid ? 'Docs in folder…' : 'Script from Google Doc…') + '</option>';
    for (const f of d.files || []) { const o = document.createElement('option'); o.value = f.id; o.textContent = f.name; sel.appendChild(o); }
    ls.set('drama-folder', raw.trim());
    setStatus((d.files || []).length ? (fid ? 'Folder: ' : 'Recent: ') + d.files.length + ' docs' : (fid ? 'No Google Docs in that folder' : 'No recent docs'));
  } catch (e) { setStatus(e.message); }
}
$('folder').value = ls.get('drama-folder', '');
$('folder').addEventListener('change', () => { if (gToken) loadRecent(); });
$('folder').addEventListener('paste', () => setTimeout(() => { if (gToken) loadRecent(); }, 0));
$('recent').onchange = async () => {
  const id = $('recent').value; if (!id) return; const name = $('recent').selectedOptions[0].textContent;
  setStatus('Loading "' + name + '"…');
  try {
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + id + '/export?mimeType=text/plain', { headers: gAuth() });
    if (r.status === 401) throw gExpired();
    if (!r.ok) throw new Error('Could not read doc (HTTP ' + r.status + ')');
    $('script').value = (await r.text()).replace(/^﻿/, '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
    $('loadBtn').click(); // parses, saves, resets the stage
    if (st === null && sc.lines.length) setStatus('Loaded "' + name + '": ' + sc.lines.length + ' lines, roles ' + sc.characters.join(' / '));
  } catch (e) { setStatus(e.message); }
  $('recent').value = '';
};
gInit();

loadScene(); resetStage();
</script>
